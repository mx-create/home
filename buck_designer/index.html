<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Buck Designer | MX Tools</title>
<meta property="og:title" content="Buck Designer">
<meta property="og:description" content="Buck converter design with worst-case analysis, compensation, Mouser part lookup and a formatted design report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-css">/* Layout: engineering workbench. Sticky tab bar (Design / Results / Report); design inputs as part cards; results as dense tables and plots; report as a typeset document. Copper accent = PCB trace. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --sunk:#f5f7f9; --ink:#17202a; --muted:#5b6672; --line:#d3d9e0;
  --copper:#a8541f; --copper-soft:#f6e6d9; --solder:#2d5a8a; --violet:#6a4c9c; --ok:#2f7a4f; --warn:#9a6300; --bad:#b3261e;
  --ok-soft:#e3f1e8; --warn-soft:#f8ecd2; --bad-soft:#f8e0de;
  --plot-bg:#fbfcfd; --grid:#e3e8ee; --band:#e9c9b1;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --panel:#171f28; --sunk:#131a22; --ink:#e4e9ee; --muted:#97a3af; --line:#2a3541;
  --copper:#e48c50; --copper-soft:#3a2718; --solder:#82aee0; --violet:#b39ae6; --ok:#62c48f; --warn:#e3a740; --bad:#f17c71;
  --ok-soft:#173326; --warn-soft:#3a2d12; --bad-soft:#3d1b19; --plot-bg:#141b23; --grid:#232d38; --band:#5a3a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#171f28; --sunk:#131a22; --ink:#e4e9ee; --muted:#97a3af; --line:#2a3541;
  --copper:#e48c50; --copper-soft:#3a2718; --solder:#82aee0; --violet:#b39ae6; --ok:#62c48f; --warn:#e3a740; --bad:#f17c71;
  --ok-soft:#173326; --warn-soft:#3a2d12; --bad-soft:#3d1b19; --plot-bg:#141b23; --grid:#232d38; --band:#5a3a24; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:28px}
h2{font-size:19px;display:flex;align-items:baseline;gap:10px}
h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--copper);font-weight:500}
h3{font-size:16px}h4{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
a{color:var(--solder)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-bottom:12px}
header.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.tools{display:flex;gap:6px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:4px;align-items:center;border-bottom:2px solid var(--ink);margin-bottom:18px;padding-top:4px}
nav.tabs a{font:600 15px var(--f-display);color:var(--muted);text-decoration:none;padding:9px 14px;border-radius:6px 6px 0 0;letter-spacing:.02em}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs .run{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding-right:2px;min-width:0}
@media (max-width:540px){nav.tabs .run{order:3;width:100%;margin-left:0;padding:2px 2px 6px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.dot.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}}

.view{display:flex;flex-direction:column;gap:22px}
section.block{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1060px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.gtitle{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.gtitle:first-child{margin-top:0}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:18px}
.fi{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;background:var(--sunk);overflow:hidden}
.fi:focus-within{border-color:var(--copper);box-shadow:0 0 0 2px var(--copper-soft)}
.fi input,.fi select,.fi textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--f-mono);font-size:14px;padding:6px 8px;outline:none;font-variant-numeric:tabular-nums}
.fi textarea{font-family:var(--f-body);resize:vertical;min-height:60px}
.fi select{font-family:var(--f-body)}
.fi em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:6px 8px 6px 0;white-space:nowrap;align-self:center}
.fi.text input{font-family:var(--f-body)}
.src{width:7px;height:7px;border-radius:50%;flex:none}
.src.ex{border:1px dashed var(--muted)}.src.mouser{background:var(--solder)}.src.lib{background:var(--ok)}.src.user{background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--copper);width:16px;height:16px}

.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pn{display:flex;gap:8px;flex-wrap:wrap}
.pn .fi{flex:1 1 180px}
.pn .fi input{text-transform:uppercase}
.meta{font-size:13px;display:flex;flex-direction:column;gap:4px}
.mz{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.mrow{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12px}
.hint{font-size:12px;color:var(--muted);padding-left:12px;position:relative}
.hint::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;align-items:center}
.verify{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.libbar select{width:100%;font:13px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
details.more>summary{cursor:pointer;font-size:12px;color:var(--solder);list-style:none;padding:2px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more>.grid2{margin-top:10px}

.btn{font:500 13px var(--f-body);border-radius:5px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,nav.tabs a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.ex,.chip.info{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.chip.ai{background:var(--copper-soft);color:var(--copper)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:0}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}

.capgrp{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.capgrp .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.capgrp .hd .tag{font:600 13px var(--f-mono);color:var(--copper)}
.caps{display:flex;flex-direction:column;gap:12px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;white-space:nowrap}
table.t td{font-family:var(--f-mono)}
table.t td:first-child,table.t td.lim{font-family:var(--f-body)}
table.t td.lim{text-align:left;color:var(--muted);font-size:12px}
table.t .sub{font-size:11px;color:var(--muted);font-family:var(--f-body);margin-top:2px}
table.t .u{font-size:11px;color:var(--muted);font-weight:400}
table.t tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
table.wca tr.st-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
table.wca tr.st-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.kvt th{text-align:left;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;width:34%}
table.kvt td{text-align:left;font-family:var(--f-body)}
.scroll{overflow-x:auto;min-width:0}
.meter{display:inline-block;width:46px;height:6px;background:var(--sunk);border-radius:3px;margin-right:6px;vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)}.m-warn{background:var(--warn)}.m-bad{background:var(--bad)}.m-info{background:var(--muted)}
i.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--sunk);margin-top:12px}
.bar i{display:block;height:100%}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.summary div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary b{font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.summary .sub{font-size:12px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks .t1{font-weight:500}.checks .t2{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.kv.two{grid-template-columns:minmax(0,1fr) auto}
@media (min-width:760px){.kv.two{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;column-gap:28px}}
.circs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.circ{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
svg.plot{display:block;max-width:100%;height:auto}
svg text{font-family:var(--f-mono);font-size:11px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.plegend i{display:inline-block;width:16px;height:3px;border-radius:2px}
figure{margin:0}
figcaption{font-size:12px;color:var(--muted);margin-top:6px;max-width:80ch}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:5px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* ---------- report ---------- */
.report{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,4vw,48px);max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.report section{display:flex;flex-direction:column;gap:12px}
.report h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px}
.report h2 .n{font-size:13px}
.report h3{font-size:16px;margin-top:6px}
.report p{margin:0;max-width:72ch}
.rp-head{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:18px}
.rp-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--copper);font-weight:600}
.rp-head h1{font-size:clamp(26px,4vw,36px);line-height:1.15}
.rp-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.rp-meta b{color:var(--ink);font-weight:500}
.rp-notes{color:var(--muted)}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:6px;padding:12px 14px;border:1px solid var(--line)}
.verdict>div:first-child{display:flex;flex-direction:column;gap:2px}
.verdict span{font-size:12px;color:var(--muted)}
.verdict b{font-size:16px}
.verdict.v-ok{background:var(--ok-soft)}.verdict.v-warn{background:var(--warn-soft)}.verdict.v-bad{background:var(--bad-soft)}
.verdict .vc{display:flex;gap:6px;flex-wrap:wrap}
.toc{font-size:13px}
.toc ol{columns:2 220px;margin:6px 0 0;padding-left:20px}
.toc li{padding:1px 0}
.eq{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-left:3px solid var(--copper);padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;overflow-x:auto}
.eq .lhs{font-weight:500}.eq .op{color:var(--muted)}.eq b{font-weight:600;color:var(--copper)}
ul.assume,ul.issues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
ul.issues{list-style:none;padding-left:0}
ul.issues li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.callout{background:var(--warn-soft);border-radius:5px;padding:10px 12px}
.rp-foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
body.standalone{padding:24px 16px;background:var(--bg)}
@media print{
  :root{--bg:#fff;--panel:#fff;--sunk:#f4f6f8;--plot-bg:#fff}
  body{background:#fff}
  header.top,nav.tabs,.view:not(#view-report),.rp-tools,.toast,body::before{display:none!important}
  #view-report{display:block!important}
  .report{border:0;padding:0;max-width:none}
  .report section{break-inside:auto}
  .report h2{break-after:avoid}
  figure,table,.eq,.verdict{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Buck Designer</h1>
      <p>Synchronous buck design with worst-case analysis: specify, pick parts, then review results and the design report.</p>
    </div>
    <div class="tools">
      <button class="btn sm" id="btn-proj-save" type="button">Save project</button>
      <button class="btn sm" id="btn-proj-open" type="button">Open project</button>
      <button class="btn sm" id="btn-lib-x" type="button">Export library</button>
      <button class="btn sm" id="btn-lib-i" type="button">Import library</button>
      <button class="btn sm" id="btn-reset" type="button">New from example</button>
      <input type="file" id="file-proj" accept=".json,application/json" hidden>
      <input type="file" id="file-lib" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#design">Design</a><a href="#results">Results</a><a href="#report">Report</a>
    <span class="run" id="run" role="status"></span>
  </nav>
  <main>
    <div class="view" id="view-design"></div>
    <div class="view" id="view-results" hidden></div>
    <div class="view" id="view-report" hidden></div>
  </main>
</div>
<script id="engine">/* ===================== Buck WCA core: pure engineering, no DOM ===================== */
"use strict";
const Core=(function(){
const TW=2*Math.PI;

/* ---------- complex arithmetic: [re, im] ---------- */
const CX={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],
  mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
  div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]},
  inv:a=>{const d=a[0]*a[0]+a[1]*a[1];return [a[0]/d,-a[1]/d]},
  sc:(a,k)=>[a[0]*k,a[1]*k],
  par:(a,b)=>{const s=[a[0]+b[0],a[1]+b[1]];const p=[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];const d=s[0]*s[0]+s[1]*s[1];return [(p[0]*s[0]+p[1]*s[1])/d,(p[1]*s[0]-p[0]*s[1])/d]},
  abs:a=>Math.hypot(a[0],a[1]),
  arg:a=>Math.atan2(a[1],a[0]),
  conj:a=>[a[0],-a[1]],
  expj:th=>[Math.cos(th),Math.sin(th)]
};
const jw=f=>[0,TW*f];
const zC=(s,C)=>CX.inv(CX.sc(s,C));

/* ---------- preferred values ---------- */
const E96=[1.00,1.02,1.05,1.07,1.10,1.13,1.15,1.18,1.21,1.24,1.27,1.30,1.33,1.37,1.40,1.43,1.47,1.50,1.54,1.58,1.62,1.65,1.69,1.74,1.78,1.82,1.87,1.91,1.96,2.00,2.05,2.10,2.15,2.21,2.26,2.32,2.37,2.43,2.49,2.55,2.61,2.67,2.74,2.80,2.87,2.94,3.01,3.09,3.16,3.24,3.32,3.40,3.48,3.57,3.65,3.74,3.83,3.92,4.02,4.12,4.22,4.32,4.42,4.53,4.64,4.75,4.87,4.99,5.11,5.23,5.36,5.49,5.62,5.76,5.90,6.04,6.19,6.34,6.49,6.65,6.81,6.98,7.15,7.32,7.50,7.68,7.87,8.06,8.25,8.45,8.66,8.87,9.09,9.31,9.53,9.76];
const E12=[1.0,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
const E192=Array.from({length:192},(_,i)=>{const v=Math.round(Math.pow(10,i/192)*100)/100;return v===9.19?9.20:v});
const E6=[1.0,1.5,2.2,3.3,4.7,6.8];
function snap(x,ser,dir){
  if(!(x>0)||!isFinite(x))return NaN;
  const dec=Math.floor(Math.log10(x));const cand=[];
  for(const d of [dec-1,dec,dec+1])for(const v of ser)cand.push(v*Math.pow(10,d));
  if(dir==="up"){return cand.filter(v=>v>=x*0.9999).sort((a,b)=>a-b)[0]}
  let best=cand[0];for(const v of cand)if(Math.abs(Math.log(v/x))<Math.abs(Math.log(best/x)))best=v;return best;
}

/* ---------- capacitor type presets ---------- */
const CAP_TYPES={
  mlcc:{label:"Ceramic (MLCC)",esl:0.5,tol:10,temp:15,eol:5,esrLo:0.7,esrHi:1.5,derate:"drCapMlcc"},
  poly:{label:"Polymer (Al/Ta)",esl:1.5,tol:20,temp:10,eol:10,esrLo:0.8,esrHi:2,derate:"drCapPoly"},
  tant:{label:"Tantalum (MnO₂)",esl:2,tol:20,temp:10,eol:10,esrLo:0.8,esrHi:2.5,derate:"drCapTant"},
  alu:{label:"Aluminium electrolytic",esl:5,tol:20,temp:20,eol:20,esrLo:0.8,esrHi:3,derate:"drCapAlu"},
  film:{label:"Film",esl:3,tol:5,temp:3,eol:3,esrLo:0.8,esrHi:1.3,derate:"drCapFilm"}
};

/* ---------- impedance of a bank of capacitor rows ---------- */
function rowZ(b,s){return CX.add(CX.add([b.esr,0],CX.sc(s,b.esl)),zC(s,b.C))}
function bankZ(rows,s){
  let y=[0,0];
  for(const b of rows){if(!(b.n>0&&b.C>0))continue;y=CX.add(y,CX.sc(CX.inv(rowZ(b,s)),b.n))}
  return CX.abs(y)>0?CX.inv(y):[1e12,0];
}

/* ---------- design → realised model at a corner ----------
   corner c = {vin, io, T:'min'|'nom'|'max', life:'bol'|'eol', k:{param:-1|0|1}} */
function capRow(r,kc,ke){
  const C0=r.c*1e-6*(1-(r.dc||0)/100);
  const C=kc>0?C0*(1+r.tol/100):kc<0?C0*(1-r.tol/100)*(1-r.temp/100)*(1-r.eol/100):C0;
  const esr=r.esr*1e-3*(ke>0?r.esrHi:ke<0?r.esrLo:1);
  return {n:Math.max(0,Math.round(r.n||0)),C,esr,esl:(r.esl||0)*1e-9,type:r.type,vr:r.vr,irms:r.irmsC};
}
function rdsAt(rds25,alpha,Tj,eolPct,eol){return rds25*1e-3*(1+alpha/100*(Tj-25))*(eol?1+eolPct/100:1)}
function rtotPct(D,fb){
  const sp=D.specs,ru=D.rules;
  return (fb?ru.rFbTol:ru.rTol)+ru.rTc*1e-4*Math.max(Math.abs(sp.tMax-25),Math.abs(sp.tMin-25))+ru.rEol;
}
function realize(D,c){
  const sp=D.specs,ic=D.ic,k=c.k||{},v=x=>x||0,ind=D.ind;
  const m={vin:c.vin,io:c.io,vo:sp.vout,ctrl:D.ctrl,ea:D.ea,mode:D.mode,life:c.life||"bol"};
  m.T=c.T==="min"?sp.tMin:c.T==="max"?sp.tMax:25;
  m.fsw=sp.fsw*1e3*(1+v(k.fsw)*ic.fswTol/100);
  const L0=ind.L*1e-6;
  m.L=k.L>0?L0*(1+ind.ltol/100):k.L<0?L0*(1-ind.ltol/100)*(1-ind.ltemp/100)*(1-ind.lsat/100):L0;
  m.cout=D.cout.map(r=>capRow(r,v(k.cout),v(k.esr)));
  m.cin=D.cin.map(r=>capRow(r,v(k.cin),v(k.cinEsr)));
  m.vref=ic.vref*(1+v(k.vref)*ic.vrefTol/100);
  const rt=rtotPct(D,true);
  m.ratio=D.fb.rtop*(1+v(k.rt)*rt/100)/(D.fb.rbot*(1-v(k.rb)*rt/100));
  const mod=1+v(k.mod)*ic.modTol/100;
  m.vramp=ic.vramp*mod*(D.feedforward?c.vin/sp.vinNom:1);
  m.ri=ic.ri*mod;
  m.se=ic.se*1e6*(1-v(k.mod)*ic.modTol/100);
  m.gm=ic.eaGm*1e-6*(1+v(k.ea)*ic.eaTol/100);
  m.a0=Math.pow(10,ic.eaAol/20);
  m.gbw=ic.eaGbw*1e6*(1+v(k.ea)*ic.eaTol/100);
  const cr=1+v(k.compR)*D.rules.rTol/100,cc=1+v(k.compC)*D.rules.cTolComp/100;
  const q=(D.comp&&D.comp.chosen)||{type:2,R2:1,R3:0,C1:1e-9,C2:0,C3:0,Rc:1,Cc:1e-9,Cp:0,Cff:0};
  m.comp={type:q.type,R1:D.fb.rtop*cr,R2:q.R2*cr,R3:q.R3*cr,C1:q.C1*cc,C2:q.C2*cc,C3:q.C3*cc,Rc:q.Rc*cr,Cc:q.Cc*cc,Cp:q.Cp*cc,Cff:q.Cff*cc,rtop:D.fb.rtop*cr,rbot:D.fb.rbot*cr};
  m.D=Math.min(m.vo/m.vin,0.99);
  const rhs=D.mode==="ext"?D.hs.rds*1e-3:ic.rdsHs*1e-3, rls=D.mode==="ext"?D.ls.rds*1e-3:ic.rdsLs*1e-3;
  m.rdc=ind.dcr*1e-3+m.D*rhs+(1-m.D)*rls;
  m.sn=(m.vin-m.vo)/m.L;
  m.mc=1+m.se/m.sn;
  m.lf=D.filter.lf*1e-6*(1+v(k.lf)*D.filter.lfTol/100);
  return m;
}

/* ---------- compensator and loop ---------- */
function compAt(m,s){
  const q=m.comp;
  if(m.ea==="opamp"){
    let Zi=[q.R1,0];
    if(q.type===3)Zi=CX.par(Zi,CX.add([q.R3,0],zC(s,q.C3)));
    let Zf=CX.add([q.R2,0],zC(s,q.C1));
    if(q.C2>0)Zf=CX.par(Zf,zC(s,q.C2));
    const G=CX.div(Zf,Zi);
    const wa=TW*m.gbw/m.a0;
    const A=CX.div([m.a0,0],CX.add([1,0],CX.sc(s,1/wa)));
    return CX.div(G,CX.add([1,0],CX.div(CX.add([1,0],G),A)));
  }
  let Zt=[q.rtop,0];
  if(q.type===3&&q.Cff>0)Zt=CX.par(Zt,zC(s,q.Cff));
  const H=CX.div([q.rbot,0],CX.add([q.rbot,0],Zt));
  let Zc=CX.add([q.Rc,0],zC(s,q.Cc));
  if(q.Cp>0)Zc=CX.par(Zc,zC(s,q.Cp));
  Zc=CX.par(Zc,[m.a0/m.gm,0]);
  return CX.sc(CX.mul(H,Zc),m.gm);
}
function plantAt(m,s){
  const Zc=bankZ(m.cout,s),R=[m.vo/Math.max(m.io,1e-6),0];
  if(m.ctrl==="vm"){
    const Zs=CX.add([m.rdc,0],CX.sc(s,m.L));
    const Zp=CX.par(Zc,R);
    return {Gp:CX.sc(CX.div(Zp,CX.add(Zs,Zp)),m.vin/m.vramp),Zol:CX.par(Zs,Zc)};
  }
  const x=m.mc*(1-m.D)-0.5;
  const Rp=x>0?m.L*m.fsw/x:1e6;
  const wn=Math.PI*m.fsw,Qp=x>0?1/(Math.PI*x):50;
  const Fh=CX.inv(CX.add(CX.add([1,0],CX.sc(s,1/(wn*Qp))),CX.sc(CX.mul(s,s),1/(wn*wn))));
  const Zl=CX.par(CX.par(Zc,R),[Rp,0]);
  return {Gp:CX.mul(CX.sc(Zl,1/m.ri),Fh),Zol:CX.par(Zc,[Rp,0])};
}
function loopAt(m,s){
  const p=plantAt(m,s),Gc=compAt(m,s);
  return {T:CX.mul(Gc,p.Gp),Zol:p.Zol,Gp:p.Gp,Gc};
}
function logspace(a,b,n){const r=[],la=Math.log10(a),lb=Math.log10(b);for(let i=0;i<n;i++)r.push(Math.pow(10,la+(lb-la)*i/(n-1)));return r}
function sweep(m,freqs){
  const mag=[],ph=[],zcl=[],zol=[],gpm=[],gpp=[],gcm=[],gcp=[];let prev=null,pg=null,pc=null;
  for(const f of freqs){
    const r=loopAt(m,jw(f));
    let p=CX.arg(r.T)*180/Math.PI;
    if(prev!==null){while(p-prev>180)p-=360;while(p-prev<-180)p+=360}
    prev=p;mag.push(CX.abs(r.T));ph.push(p);
    zcl.push(CX.abs(CX.div(r.Zol,CX.add([1,0],r.T))));zol.push(CX.abs(r.Zol));
    let a=CX.arg(r.Gp)*180/Math.PI;if(pg!==null){while(a-pg>180)a-=360;while(a-pg<-180)a+=360}pg=a;gpm.push(CX.abs(r.Gp));gpp.push(a);
    let b=CX.arg(r.Gc)*180/Math.PI;if(pc!==null){while(b-pc>180)b-=360;while(b-pc<-180)b+=360}pc=b;gcm.push(CX.abs(r.Gc));gcp.push(b);
  }
  return {f:freqs,mag,ph,zcl,zol,gpm,gpp,gcm,gcp};
}
function loopMetrics(sw){
  const {f,mag,ph}=sw;let fc=NaN,pm=NaN,gm=Infinity,fgm=NaN,crossings=0,ic=-1;
  for(let i=0;i<f.length-1;i++){
    if(mag[i]>=1&&mag[i+1]<1){crossings++;if(ic<0){ic=i;const t=Math.log(mag[i])/(Math.log(mag[i])-Math.log(mag[i+1]));fc=f[i]*Math.pow(f[i+1]/f[i],t);pm=180+ph[i]+(ph[i+1]-ph[i])*t}}
  }
  if(ic>=0){
    for(let i=ic;i<f.length-1;i++){
      if(ph[i]>-180&&ph[i+1]<=-180){const t=(ph[i]+180)/(ph[i]-ph[i+1]);const lm=Math.log10(mag[i])+(Math.log10(mag[i+1])-Math.log10(mag[i]))*t;gm=-20*lm;fgm=f[i]*Math.pow(f[i+1]/f[i],t);break}
    }
  }
  let zpk=0;for(const z of sw.zcl)zpk=Math.max(zpk,z);
  return {fc,pm,gm,fgm,conditional:crossings>1,zclPk:zpk};
}

/* ---------- compensation design (nominal) ---------- */
function plantFeatures(D){
  const sp=D.specs;
  const m=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{}});
  const Ct=m.cout.reduce((a,b)=>a+b.n*b.C,0);
  const f0=1/(TW*Math.sqrt(m.L*Ct));
  let fesr=Infinity;
  for(const f of logspace(f0,m.fsw,200)){const z=bankZ(m.cout,jw(f));if(CX.arg(z)*180/Math.PI>-45){fesr=f;break}}
  const x=m.mc*(1-m.D)-0.5,Rp=x>0?m.L*m.fsw/x:1e6;
  const Rl=m.vo/m.io;const Req=Rl*Rp/(Rl+Rp);
  const fpl=1/(TW*Req*Ct);
  return {m,Ct,f0,fesr,fpl,fc:m.fsw/sp.fcRatio};
}
function designComp(D){
  const pf=plantFeatures(D),m=pf.m,fc=pf.fc,fsw=m.fsw;
  const type=D.compType==="2"?2:D.compType==="3"?3:(D.ctrl==="vm"?3:2);
  const fpHi=Math.min(pf.fesr,fsw/2);
  let pl={};
  if(D.ctrl==="vm"){
    if(type===3)pl={fz1:0.5*pf.f0,fz2:pf.f0,fp1:Math.max(fpHi,pf.f0*1.5),fp2:fsw/2};
    else pl={fz1:pf.f0,fp2:fsw/2};
  }else{
    const fz=Math.min(Math.max(pf.fpl,fc/5),fc/3);
    if(type===3)pl={fz1:fz,fz2:fc/3,fp1:Math.min(fc*3,fsw/2),fp2:fpHi};
    else pl={fz1:fz,fp2:fpHi};
  }
  const R1=D.fb.rtop,rbot=D.fb.rbot;
  if(D.ea==="gm"&&type===3){
    /* feed-forward capacitor across Rtop: centre its zero/pole pair on the crossover for maximum boost */
    const kr=(R1+rbot)/rbot;pl.fz2=fc/Math.sqrt(kr);pl.fpff=fc*Math.sqrt(kr);
    if(D.ctrl==="vm")pl.fz1=pf.f0;
  }
  const q={type,R2:0,R3:0,C1:0,C2:0,C3:0,Rc:0,Cc:0,Cp:0,Cff:0};
  const set=x=>{
    if(D.ea==="opamp"){
      q.R2=x;q.C1=1/(TW*x*pl.fz1);q.C2=1/(TW*x*pl.fp2);
      if(type===3){q.R3=R1/(pl.fp1/pl.fz2-1);q.C3=1/(TW*q.R3*pl.fp1)}
    }else{
      q.Rc=x;q.Cc=1/(TW*x*pl.fz1);q.Cp=1/(TW*x*pl.fp2);
      if(type===3)q.Cff=1/(TW*R1*pl.fz2);
    }
  };
  const mm=Object.assign({},m);
  let x=10e3;
  for(let i=0;i<60;i++){
    set(x);mm.comp=Object.assign({},q,{R1,rtop:R1,rbot});
    const g=CX.abs(loopAt(mm,jw(fc)).T);
    if(!isFinite(g)||g<=0)break;
    const nx=x/g;if(Math.abs(nx/x-1)<1e-4){x=nx;break}x=nx;
  }
  set(x);
  const ideal=Object.assign({},q);
  const chosen={type};
  for(const key of ["R2","R3","Rc"])chosen[key]=q[key]>0?snap(q[key],E96):0;
  for(const key of ["C1","C2","C3","Cc","Cp","Cff"])chosen[key]=q[key]>0?snap(q[key],E12):0;
  return {ideal,chosen,pl,f0:pf.f0,fesr:pf.fesr,fpl:pf.fpl,fc,Ct:pf.Ct,type};
}

/* ---------- periodic waveforms → harmonics ---------- */
function harmonics(fn,K,N){
  N=N||512;const x=[];for(let n=0;n<N;n++)x.push(fn(n/N));
  const a=[];
  for(let k=1;k<=K;k++){let re=0,im=0;for(let n=0;n<N;n++){const th=-TW*k*n/N;re+=x[n]*Math.cos(th);im+=x[n]*Math.sin(th)}a.push([re/N,im/N])}
  return a;
}
function synth(V,P){const w=[];for(let j=0;j<P;j++){let s=0;for(let k=0;k<V.length;k++){const th=TW*(k+1)*j/P;s+=2*(V[k][0]*Math.cos(th)-V[k][1]*Math.sin(th))}w.push(s)}return w}
const KH=40;
function outRipple(m){
  const D=m.D,dI=(m.vin-m.vo)*D/(m.L*m.fsw);
  const a=harmonics(t=>t<D?-dI/2+dI*t/D:dI/2-dI*(t-D)/(1-D),KH);
  const R=[m.vo/Math.max(m.io,1e-6),0];
  const V=[],I=m.cout.map(()=>0);
  a.forEach((ak,i)=>{
    const s=jw((i+1)*m.fsw);const Zc=bankZ(m.cout,s);const Vk=CX.mul(ak,CX.par(Zc,R));V.push(Vk);
    m.cout.forEach((b,j)=>{if(b.n>0&&b.C>0){const Ib=CX.div(Vk,rowZ(b,s));I[j]+=2*(Ib[0]*Ib[0]+Ib[1]*Ib[1])}});
  });
  const w=synth(V,200);
  return {dI,vpp:Math.max(...w)-Math.min(...w),wave:w,irms:m.cout.map((b,j)=>b.n>0?Math.sqrt(I[j]):0)};
}
function inRipple(m,filt){
  const D=m.D,dI=(m.vin-m.vo)*D/(m.L*m.fsw);
  const a=harmonics(t=>t<D?m.io-dI/2+dI*t/D:0,KH);
  const V=[],I=m.cin.map(()=>0);let Isrc=0,Isrc1=0;
  a.forEach((ak,i)=>{
    const s=jw((i+1)*m.fsw);let Zn=bankZ(m.cin,s);let Zlf=null;
    if(filt&&filt.on){Zlf=CX.add([filt.lfDcr*1e-3,0],CX.sc(s,m.lf));Zn=CX.par(Zn,Zlf);
      if(filt.rd>0&&filt.cd>0)Zn=CX.par(Zn,CX.add([filt.rd,0],zC(s,filt.cd*1e-6)))}
    const Vk=CX.mul(ak,Zn);V.push(Vk);
    m.cin.forEach((b,j)=>{if(b.n>0&&b.C>0){const Ib=CX.div(Vk,rowZ(b,s));I[j]+=2*(Ib[0]*Ib[0]+Ib[1]*Ib[1])}});
    if(Zlf){const Is=CX.div(Vk,Zlf);const p=Is[0]*Is[0]+Is[1]*Is[1];Isrc+=2*p;if(i===0)Isrc1=2*Math.sqrt(p)}
  });
  const w=synth(V,200);
  return {vpp:Math.max(...w)-Math.min(...w),wave:w,irms:m.cin.map((b,j)=>b.n>0?Math.sqrt(I[j]):0),srcRms:Math.sqrt(Isrc),srcPk1:Isrc1,
    irmsTotal:m.io*Math.sqrt(D*(1-D)+D*dI*dI/(12*m.io*m.io))};
}

/* ---------- losses and thermal at an operating point ---------- */
function losses(D,vin,io,Ta,eol,opt){
  opt=opt||{};
  const sp=D.specs,ic=D.ic,ind=D.ind,f=sp.fsw*1e3,vo=sp.vout,L=ind.L*1e-6;
  const Dc=Math.min(vo/vin,0.99),dI=(vin-vo)*Dc/(f*L),i2=io*io+dI*dI/12,irms=Math.sqrt(i2);
  const tInd=Ta+ind.dTr*Math.pow(irms/ind.irms,2);
  const dcr=ind.dcr*1e-3*(1+ind.dcrTc/100*(tInd-25));
  const o={};let tjHs=Ta,tjLs=Ta,tjIc=Ta;
  for(let it=0;it<8;it++){
    if(D.mode==="ext"){
      const h=D.hs,l=D.ls;
      const rh=rdsAt(h.rds,h.rdsAlpha,tjHs,h.rdsEol,eol),rl=rdsAt(l.rds,l.rdsAlpha,tjLs,l.rdsEol,eol);
      o["HS conduction"]=Dc*i2*rh;
      const qsw=(h.qgd+h.qgs/2)*1e-9,ion=Math.max(ic.vdrv-h.vpl,0.2)/ic.rdrv,ioff=Math.max(h.vpl,0.2)/ic.rdrv;
      o["HS switching"]=0.5*vin*io*(qsw/ion+qsw/ioff)*f;
      o["Reverse recovery"]=l.qrr*1e-9*vin*f;
      o["Coss"]=0.5*(h.coss+l.coss)*1e-12*vin*vin*f;
      o["LS conduction"]=(1-Dc)*i2*rl;
      o["Dead time"]=l.vf*io*2*ic.tdead*1e-9*f;
      o["Gate drive"]=(h.qg+l.qg)*1e-9*ic.vdrv*f;
      const pHs=o["HS conduction"]+o["HS switching"]+o["Reverse recovery"]+o["Coss"]/2;
      const pLs=o["LS conduction"]+o["Dead time"]+o["Coss"]/2;
      tjHs=Ta+pHs*h.rth;tjLs=Ta+pLs*l.rth;
      o._pHs=pHs;o._pLs=pLs;
    }else{
      const rh=rdsAt(ic.rdsHs,ic.rdsAlpha,tjIc,0,false),rl=rdsAt(ic.rdsLs,ic.rdsAlpha,tjIc,0,false);
      o["HS conduction"]=Dc*i2*rh;
      o["HS switching"]=0.5*vin*io*ic.tsw*1e-9*f;
      o["LS conduction"]=(1-Dc)*i2*rl;
      o["Dead time"]=0.7*io*2*ic.tdead*1e-9*f;
      const pIc=o["HS conduction"]+o["HS switching"]+o["LS conduction"]+o["Dead time"]+ic.iq*1e-3*vin;
      tjIc=Ta+pIc*ic.rthIc;o._pIc=pIc;
    }
  }
  o["Controller bias"]=ic.iq*1e-3*vin;
  o["Inductor DCR"]=i2*dcr;
  o["Inductor core"]=(ind.pcore||0)*1e-3;
  if(opt.capOut!=null)o["Output cap ESR"]=opt.capOut;
  if(opt.capIn!=null)o["Input cap ESR"]=opt.capIn;
  if(opt.snub)o["Snubber"]=opt.snub;
  let tot=0;for(const k in o)if(k[0]!=="_")tot+=o[k];
  const pout=vo*io;
  return {o,tot,eff:pout/(pout+tot),tjHs,tjLs,tjIc,tInd,irmsL:irms,dI,pin:pout+tot};
}

/* ---------- FFT and load-step transient ---------- */
function fft(re,im,inv){

  for(const p of params){
    const a=fn(Object.assign({},op,{k:{[p]:1}}))[key]-base,b=fn(Object.assign({},op,{k:{[p]:-1}}))[key]-base;
    const u=Math.max(0,a,b),d=Math.max(0,-a,-b);up+=u*u;dn+=d*d;contrib.push({p,u,d});
  }
  return {base,hi:base+Math.sqrt(up),lo:base-Math.sqrt(dn),contrib};
}
function status(row){
  const {dir,limit}=row;if(limit==null||!isFinite(limit))return "info";
  if(dir==="max"){if(row.eva.max<=limit)return "ok";if(row.rss&&row.rss.hi<=limit)return "warn";return "bad"}
  if(dir==="min"){if(row.eva.min>=limit)return "ok";if(row.rss&&row.rss.lo>=limit)return "warn";return "bad"}
  return "info";
}

function run(D){
  const sp=D.specs,ru=D.rules,ic=D.ic,ind=D.ind,ext=D.mode==="ext";
  const VIN=[sp.vinMin,sp.vinNom,sp.vinMax];
  const opsVin=(io,extra)=>VIN.map(v=>Object.assign({vin:v,io},extra||{}));
  const nomOp={vin:sp.vinNom,io:sp.ioutMax,T:"nom",life:"bol"};
  const R={rows:[],plots:{},circuits:{},stress:[],checks:[],corners:0,notes:[]};
  const rows=R.rows;
  const addRow=o=>{o.status=o.status||status(o);rows.push(o);return o};

  /* ---- 1. DC set-point ---- */
  {
    const fn=c=>{const m=realize(D,c);return {vo:m.vref*(1+m.ratio)}};
    const ops=[{vin:sp.vinNom,io:sp.ioutMax,T:"max",life:"eol"}];
    const g=group(ops,["vref","rt","rb"],fn,["vo"]);R.corners+=g._n;
    const r=rss(fn,ops[0],["vref","rt","rb"],"vo");
    const nom=fn({vin:sp.vinNom,io:sp.ioutMax,k:{}}).vo;
    const lim=sp.vout*sp.voutAcc/100;
    const worst=Math.max(Math.abs(g.vo.max-sp.vout),Math.abs(sp.vout-g.vo.min));
    const worstR=Math.max(Math.abs(r.hi-sp.vout),Math.abs(sp.vout-r.lo));
    addRow({id:"vo",label:"Output DC set-point",unit:"V",nom,rss:{lo:r.lo,hi:r.hi},eva:{min:g.vo.min,max:g.vo.max},
      limitText:`${sp.vout} V ± ${sp.voutAcc} %`,status:worst<=lim?"ok":worstR<=lim?"warn":"bad",corner:cornerText(Math.abs(g.vo.max-sp.vout)>Math.abs(sp.vout-g.vo.min)?g.vo.cMax:g.vo.cMin),
      basis:"Vref tolerance; each divider resistor at its tolerance + tempco over the range + EOL drift",dig:4});
    R.vo={min:g.vo.min,max:g.vo.max,nom};
  }

  /* ---- 2. Inductor currents ---- */
  let gi;
  {
    const fn=c=>{const m=realize(D,c);const dI=(m.vin-m.vo)*m.D/(m.L*m.fsw);return {dI,ipk:m.io+dI/2,irms:Math.sqrt(m.io*m.io+dI*dI/12)}};
    gi=group(opsVin(sp.ioutMax),["L","fsw"],fn,["dI","ipk","irms"]);R.corners+=gi._n;
    const nom=fn(Object.assign({},nomOp,{k:{}}));
    const rI=rss(fn,gi.dI.cMax,["L","fsw"],"dI"),rP=rss(fn,gi.ipk.cMax,["L","fsw"],"ipk"),rR=rss(fn,gi.irms.cMax,["L","fsw"],"irms");
    addRow({id:"dI",label:"Inductor ripple current",unit:"A",dir:"max",limit:null,nom:nom.dI,rss:rI,eva:{min:gi.dI.min,max:gi.dI.max},limitText:`target ${sp.ripple} % = ${(sp.ripple/100*sp.ioutMax).toFixed(2)} A`,corner:cornerText(gi.dI.cMax),basis:"L tolerance, temperature and saturation drop; fsw tolerance"});
    const isatHot=ind.isat*(1-ind.isatHot/100);
    addRow({id:"ipk",label:"Inductor peak current",unit:"A",dir:"max",limit:isatHot/(1+ru.isatMargin/100),nom:nom.ipk,rss:rP,eva:{min:gi.ipk.min,max:gi.ipk.max},limitText:`Isat hot ÷ ${1+ru.isatMargin/100} = ${(isatHot/(1+ru.isatMargin/100)).toFixed(2)} A`,corner:cornerText(gi.ipk.cMax),basis:"Full load plus half the worst-case ripple"});
    addRow({id:"irmsL",label:"Inductor RMS current",unit:"A",dir:"max",limit:ind.irms*ru.drIndI/100,nom:nom.irms,rss:rR,eva:{min:gi.irms.min,max:gi.irms.max},limitText:`${ru.drIndI} % of ${ind.irms} A`,corner:cornerText(gi.irms.cMax)});
  }

  /* ---- 3. Output ripple and output cap currents ---- */
  let goR,nomOut;
  {
    const P=["L","cout","esr","fsw"];
    const fn=c=>{const r=outRipple(realize(D,c));const o={vpp:r.vpp};r.irms.forEach((x,i)=>o["ic"+i]=x);return o};
    const keys=["vpp"].concat(D.cout.map((_,i)=>"ic"+i));
    goR=group(opsVin(sp.ioutMax),P,fn,keys);R.corners+=goR._n;
    nomOut=outRipple(realize(D,Object.assign({},nomOp,{k:{}})));
    const r=rss(fn,goR.vpp.cMax,P,"vpp");
    addRow({id:"vrip",label:"Output ripple",unit:"mV",scale:1e3,dir:"max",limit:sp.vrip*1e-3,nom:nomOut.vpp,rss:r,eva:{min:goR.vpp.min,max:goR.vpp.max},limitText:`${sp.vrip} mV pk-pk`,corner:cornerText(goR.vpp.cMax),basis:`Harmonic sum (40 harmonics) of the inductor ripple into the complex impedance of ${D.cout.length} capacitor group${D.cout.length>1?"s":""} (C, ESR, ESL)`});
    const worstM=realize(D,goR.vpp.cMax);R.plots.rippleOut={nom:nomOut.wave,worst:outRipple(worstM).wave,fsw:sp.fsw*1e3};
    R.capOut=D.cout.map((row,i)=>({max:goR["ic"+i].max,nom:nomOut.irms[i]}));
  }

  /* ---- 4. Input ripple, input cap currents, source current ---- */
  let gin,nomIn;
  {
    const P=["L","cin","cinEsr","fsw"].concat(D.filter.on?["lf"]:[]);
    const fn=c=>{const r=inRipple(realize(D,c),D.filter);const o={vpp:r.vpp,src:r.srcPk1};r.irms.forEach((x,i)=>o["ic"+i]=x);return o};
    const keys=["vpp","src"].concat(D.cin.map((_,i)=>"ic"+i));
    gin=group(opsVin(sp.ioutMax),P,fn,keys);R.corners+=gin._n;
    nomIn=inRipple(realize(D,Object.assign({},nomOp,{k:{}})),D.filter);
    const r=rss(fn,gin.vpp.cMax,P,"vpp");
    addRow({id:"vinrip",label:"Input ripple at converter",unit:"mV",scale:1e3,dir:"max",limit:null,nom:nomIn.vpp,rss:r,eva:{min:gin.vpp.min,max:gin.vpp.max},limitText:"—",corner:cornerText(gin.vpp.cMax),basis:"Pulsed input current harmonics into the input capacitor groups"+(D.filter.on?" in parallel with the filter":"")});
    if(D.filter.on){
      const rs=rss(fn,gin.src.cMax,P,"src");
      addRow({id:"src",label:"Source ripple current (fundamental)",unit:"mA",scale:1e3,dir:"max",limit:D.filter.srcLim*1e-3,nom:nomIn.srcPk1,rss:rs,eva:{min:gin.src.min,max:gin.src.max},limitText:`${D.filter.srcLim} mA pk`,corner:cornerText(gin.src.cMax),basis:"Current through the filter inductor at fsw"});
    }
    R.capIn=D.cin.map((row,i)=>({max:gin["ic"+i].max,nom:nomIn.irms[i]}));
    R.plots.rippleIn={nom:nomIn.wave,fsw:sp.fsw*1e3};
  }

  /* ---- 5. Control loop over corners ---- */
  const fsw=sp.fsw*1e3;
  const gridC=logspace(10,fsw/2,90);
  const P=["L","cout","esr","mod","ea","compR","compC","fsw"];
  const loopOps=[];for(const v of VIN)for(const io of [Math.max(sp.ioutMin,sp.ioutMax*0.01),sp.ioutMax])loopOps.push({vin:v,io});
  const env={magLo:gridC.map(()=>Infinity),magHi:gridC.map(()=>-Infinity),phLo:gridC.map(()=>Infinity),phHi:gridC.map(()=>-Infinity)};
  const loopFn=(c,keepEnv)=>{
    const m=realize(D,c);const sw=sweep(m,gridC);const lm=loopMetrics(sw);
    if(keepEnv){sw.mag.forEach((x,i)=>{const db=20*Math.log10(x);if(db<env.magLo[i])env.magLo[i]=db;if(db>env.magHi[i])env.magHi[i]=db;
      if(sw.ph[i]<env.phLo[i])env.phLo[i]=sw.ph[i];if(sw.ph[i]>env.phHi[i])env.phHi[i]=sw.ph[i]})}
    return {fc:lm.fc,pm:lm.pm,gm:isFinite(lm.gm)?lm.gm:99,zpk:lm.zclPk,cond:lm.conditional?1:0};
  };
  const gl=group(loopOps,P,c=>loopFn(c,true),["fc","pm","gm","zpk","cond"]);R.corners+=gl._n;
  const nomM=realize(D,Object.assign({},nomOp,{k:{}}));
  const gridD=logspace(10,fsw,200);
  const nomSw=sweep(nomM,gridD),nomLm=loopMetrics(nomSw);
  R.loop={nom:nomLm,sw:nomSw,env,gridC,gl};
  const rPm=rss(loopFn,gl.pm.cMin,P,"pm"),rGm=rss(loopFn,gl.gm.cMin,P,"gm"),rFcLo=rss(loopFn,gl.fc.cMin,P,"fc"),rFcHi=rss(loopFn,gl.fc.cMax,P,"fc");
  addRow({id:"fc",label:"Crossover frequency",unit:"kHz",scale:1e-3,dir:"max",limit:fsw/5,nom:nomLm.fc,rss:{lo:rFcLo.lo,hi:rFcHi.hi},eva:{min:gl.fc.min,max:gl.fc.max},limitText:`≤ fsw/5 = ${(fsw/5e3).toFixed(0)} kHz`,corner:cornerText(gl.fc.cMax),basis:"Highest crossover across all corners"});
  addRow({id:"pm",label:"Phase margin",unit:"°",dir:"min",limit:sp.pmMin,nom:nomLm.pm,rss:rPm,eva:{min:gl.pm.min,max:gl.pm.max},limitText:`≥ ${sp.pmMin}°`,corner:cornerText(gl.pm.cMin),basis:"Loop gain T = Gc·Gp swept 10 Hz to fsw/2 at every corner"});
  addRow({id:"gm",label:"Gain margin",unit:"dB",dir:"min",limit:sp.gmMin,nom:isFinite(nomLm.gm)?nomLm.gm:99,rss:rGm,eva:{min:gl.gm.min,max:gl.gm.max},limitText:`≥ ${sp.gmMin} dB`,corner:cornerText(gl.gm.cMin),basis:"99 dB means the phase never reaches −180° below fsw/2"});
  if(gl.cond.max>0)R.notes.push("Some corners cross 0 dB more than once (conditional stability). Review the Bode plot at the listed corner.");

  /* ---- 6. Load-step transient ---- */
  {
    const dIs=sp.ioutMax*sp.step/100;
    const tNom=transient(nomM,dIs,sp.slew,nomLm.fc);
    const cands=[gl.zpk.cMax,gl.pm.cMin,gl.fc.cMin].filter(Boolean);
    let worst=tNom,wc=nomOp;
    for(const c of cands){const m=realize(D,c);const lm=loopMetrics(sweep(m,gridC));if(!isFinite(lm.fc))continue;const t=transient(m,dIs,sp.slew,lm.fc);if(t.dev>worst.dev){worst=t;wc=c}}
    const lim=sp.vout*sp.dvTran/100;
    addRow({id:"tran",label:"Load-step deviation",unit:"mV",scale:1e3,dir:"max",limit:lim,nom:tNom.dev,rss:null,eva:{min:tNom.dev,max:worst.dev},limitText:`± ${sp.dvTran} % = ${(lim*1e3).toFixed(0)} mV`,corner:cornerText(wc),
      basis:`${dIs.toFixed(2)} A step at ${sp.slew} A/µs; closed-loop output impedance Zout/(1+T), inverse FFT. EVA checks the corners with highest |Zcl|, lowest PM and lowest fc.`});
    R.plots.tran={nom:tNom,worst,corner:cornerText(wc)};
    /* large-signal bounds when the loop saturates */
    const Lmax=ind.L*1e-6*(1+ind.ltol/100);
    const mMin=realize(D,{vin:sp.vinMin,io:sp.ioutMax,k:{cout:-1}});const Cmin=mMin.cout.reduce((a,b)=>a+b.n*b.C,0);
    R.slewBound={release:Math.sqrt(sp.vout*sp.vout+Lmax*dIs*dIs/Cmin)-sp.vout,apply:Lmax*dIs*dIs/(2*Cmin*(sp.vinMin-sp.vout))};
  }

  /* ---- 7. Current-mode sub-harmonic stability ---- */
  if(D.ctrl==="pcm"){
    const fn=c=>{const m=realize(D,c);const x=m.mc*(1-m.D)-0.5;return {qp:x>0?1/(Math.PI*x):99,mcd:m.mc*(1-m.D)}};
    const g=group(opsVin(sp.ioutMax),["L","mod","fsw"],fn,["qp","mcd"]);R.corners+=g._n;
    const nom=fn(Object.assign({},nomOp,{k:{}}));
    const r=rss(fn,g.qp.cMax,["L","mod","fsw"],"qp");
    addRow({id:"qp",label:"Sampling-gain Q (sub-harmonic)",unit:"",dir:"max",limit:1.5,nom:nom.qp,rss:r,eva:{min:g.qp.min,max:g.qp.max},limitText:"≤ 1.5 (≈ 0.64 ideal)",corner:cornerText(g.qp.cMax),basis:"Qp = 1/(π(mc·D′ − 0.5)), mc = 1 + Se/Sn",dig:3});
  }

  /* ---- 8. Losses and thermal ---- */
  {
    const capLoss=(arr,cur)=>arr.reduce((a,row,i)=>a+(row.n>0?row.n*Math.pow(cur[i]||0,2)*row.esr*1e-3:0),0);
    const snubP=D.snub.on&&ext?null:0;
    const fn=c=>{
      const Ta=c.T==="max"?sp.tMax:25;
      const mm=realize(D,Object.assign({},c,{k:{}}));const ro=outRipple(mm),ri=inRipple(mm,D.filter);
      const sn=D.snub.on&&ext?snubberDesign(D,c.vin).p:0;
      const L=losses(D,c.vin,c.io,Ta,c.life==="eol",{capOut:capLoss(D.cout,ro.irms),capIn:capLoss(D.cin,ri.irms),snub:sn});
      return {eff:L.eff,tot:L.tot,tjHs:ext?L.tjHs:NaN,tjLs:ext?L.tjLs:NaN,tjIc:ext?NaN:L.tjIc,tInd:L.tInd,_L:L};
    };
    const ops=[];for(const v of VIN)ops.push({vin:v,io:sp.ioutMax,T:"max",life:"eol"});
    const keys=["eff","tot","tjHs","tjLs","tjIc","tInd"];
    const g=group(ops,[],fn,keys);R.corners+=g._n;
    const nom=fn(Object.assign({},nomOp,{k:{}}));
    R.lossNom=nom._L;R.lossWorst=fn(g.tot.cMax)._L;R.lossWorstCorner=cornerText(g.tot.cMax);
    R.lossByVin=VIN.map(v=>({vin:v,nom:fn({vin:v,io:sp.ioutMax,T:"nom",life:"bol"})._L,hot:fn({vin:v,io:sp.ioutMax,T:"max",life:"eol"})._L}));
    addRow({id:"eff",label:"Efficiency at full load",unit:"%",scale:100,dir:"min",limit:null,nom:nom.eff,rss:null,eva:{min:g.eff.min,max:g.eff.max},limitText:"—",corner:cornerText(g.eff.cMin),basis:`Nominal at 25 °C, BOL; worst at ${sp.tMax} °C ambient, EOL Rds(on)`,dig:3});
    if(ext){
      const limH=Math.min(ru.tjLim,D.hs.tjmax),limL=Math.min(ru.tjLim,D.ls.tjmax);
      addRow({id:"tjHs",label:"High-side MOSFET Tj",unit:"°C",dir:"max",limit:limH,nom:nom.tjHs,rss:null,eva:{min:g.tjHs.min,max:g.tjHs.max},limitText:`≤ ${limH} °C`,corner:cornerText(g.tjHs.cMax),basis:"Ta + P·RθJA with Rds(on) iterated at Tj",dig:3});
      addRow({id:"tjLs",label:"Low-side MOSFET Tj",unit:"°C",dir:"max",limit:limL,nom:nom.tjLs,rss:null,eva:{min:g.tjLs.min,max:g.tjLs.max},limitText:`≤ ${limL} °C`,corner:cornerText(g.tjLs.cMax),dig:3});
    }else{
      const lim=Math.min(ru.tjLim,ic.tjmaxIc);
      addRow({id:"tjIc",label:"Converter IC Tj",unit:"°C",dir:"max",limit:lim,nom:nom.tjIc,rss:null,eva:{min:g.tjIc.min,max:g.tjIc.max},limitText:`≤ ${lim} °C`,corner:cornerText(g.tjIc.cMax),dig:3});
    }
    addRow({id:"tInd",label:"Inductor temperature",unit:"°C",dir:"max",limit:125,nom:nom.tInd,rss:null,eva:{min:g.tInd.min,max:g.tInd.max},limitText:"≤ 125 °C (check part rating)",corner:cornerText(g.tInd.cMax),basis:"Ta + rated rise × (Irms/Irated)²",dig:3});
    /* efficiency curve at nominal */
    const curve=[];for(const v of VIN){const pts=[];for(let i=1;i<=24;i++){const io=sp.ioutMax*i/24;const L=losses(D,v,io,25,false);pts.push([io,L.eff*100])}curve.push({vin:v,pts})}
    R.plots.eff=curve;
  }

  /* ---- 9. Timing and protection ---- */
  {
    const fswMax=fsw*(1+ic.fswTol/100),fswMin=fsw*(1-ic.fswTol/100);
    const tonReq=sp.vout/sp.vinMax/fswMax;
    addRow({id:"ton",label:"On-time at Vin max, fsw max",unit:"ns",scale:1e9,dir:"min",limit:ic.tonMin*1.25e-9,nom:sp.vout/sp.vinNom/fsw,rss:null,eva:{min:tonReq,max:sp.vout/sp.vinMin/fswMin},limitText:`≥ 1.25 × ${ic.tonMin} ns`,corner:`Vin ${sp.vinMax} V, fsw+`,dig:3});
    const ilimMin=ic.ilim*(1-ic.ilimTol/100),ilimMax=ic.ilim*(1+ic.ilimTol/100);
    addRow({id:"ilim",label:"Current-limit headroom",unit:"A",dir:"min",limit:gi.ipk.max,nom:ic.ilim,rss:null,eva:{min:ilimMin,max:ilimMax},limitText:`min limit ≥ worst peak ${gi.ipk.max.toFixed(2)} A`,corner:"Current limit at its low tolerance",dig:3});
    const isatHot=ind.isat*(1-ind.isatHot/100);
    addRow({id:"satlim",label:"Inductor Isat at current limit",unit:"A",dir:"min",limit:ilimMax,nom:ind.isat,rss:null,eva:{min:isatHot,max:ind.isat},limitText:`hot Isat ≥ max limit ${ilimMax.toFixed(2)} A`,corner:`${sp.tMax} °C`,basis:"Keeps the inductor out of saturation during overload",dig:3});
    R.ilim={min:ilimMin,max:ilimMax};
  }

  /* ---- 10. Supporting circuits ---- */
  R.circuits=supporting(D,gi,R);
  if(R.circuits.ss){const s=R.circuits.ss;
    addRow({id:"inrush",label:"Start-up inductor current",unit:"A",dir:"max",limit:R.ilim.min,nom:s.inrushNom,rss:null,eva:{min:s.inrushNom,max:s.inrushMax},limitText:`≤ min current limit ${R.ilim.min.toFixed(2)} A`,corner:"Cout max, soft-start fastest",basis:"Cout·Vout/tss + start-up load",dig:3})}
  if(R.circuits.uvlo){const u=R.circuits.uvlo;
    addRow({id:"uvlo",label:"UVLO start threshold",unit:"V",dir:"max",limit:sp.vinMin,nom:u.startNom,rss:null,eva:{min:u.startMin,max:u.startMax},limitText:`≤ Vin min ${sp.vinMin} V`,corner:"EN threshold and divider at tolerance",dig:3})}

  /* ---- 11. Input filter Middlebrook ---- */
  if(D.filter.on){
    const grid=logspace(100,fsw,160);
    const effW=R.lossByVin[0].hot.eff;
    const fn=c=>{const m=realize(D,c);return {mg:middlebrook(D,m,effW,grid).margin}};
    const g=group([{vin:sp.vinMin,io:sp.ioutMax}],["cin","cinEsr","lf"],fn,["mg"]);R.corners+=g._n;
    const nomMb=middlebrook(D,realize(D,{vin:sp.vinMin,io:sp.ioutMax,k:{}}),effW,grid);
    const worstMb=middlebrook(D,realize(D,g.mg.cMin),effW,grid);
    addRow({id:"mb",label:"Middlebrook impedance margin",unit:"dB",dir:"min",limit:D.filter.mbMargin,nom:nomMb.margin,rss:null,eva:{min:g.mg.min,max:g.mg.max},limitText:`≥ ${D.filter.mbMargin} dB`,corner:cornerText(g.mg.cMin),basis:"Filter output impedance against converter input impedance |Vin²·η/Pout| at Vin min, full load",dig:3});
    R.plots.mb={grid,nom:nomMb,worst:worstMb};
    R.damp=suggestDamping(D,realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{}}));
  }

  /* ---- 12. Capacitor impedance plot ---- */
  {
    const grid=logspace(1e3,Math.max(20e6,fsw*40),160);
    const mN=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{}}),mLo=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{cout:-1,esr:1}}),mHi=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{cout:1,esr:-1}});
    R.plots.zout={grid,total:grid.map(f=>CX.abs(bankZ(mN.cout,jw(f)))),lo:grid.map(f=>CX.abs(bankZ(mHi.cout,jw(f)))),hi:grid.map(f=>CX.abs(bankZ(mLo.cout,jw(f)))),
      rows:mN.cout.map(b=>grid.map(f=>b.n>0?CX.abs(CX.sc(rowZ(b,jw(f)),1/b.n)):NaN))};
    const mi=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{}});
    R.plots.zin={grid,total:grid.map(f=>CX.abs(bankZ(mi.cin,jw(f)))),rows:mi.cin.map(b=>grid.map(f=>b.n>0?CX.abs(CX.sc(rowZ(b,jw(f)),1/b.n)):NaN))};
  }

  /* ---- 13. Stress and derating ---- */
  R.stress=stressTable(D,R,gi);
  R.nomOut=nomOut;R.nomIn=nomIn;
  return R;
}

function snubberDesign(D,vin){
  const coss=D.ls.coss*1e-12,Lp=D.snub.lloop*1e-9;
  const fr=1/(TW*Math.sqrt(Lp*coss)),z0=Math.sqrt(Lp/coss);
  const Rs=snap(z0,E96),Cs=snap(3*coss,E12);
  return {fr,z0,Rs,Cs,p:Cs*vin*vin*D.specs.fsw*1e3};
}
function supporting(D,gi,R){
  const sp=D.specs,ic=D.ic,ru=D.rules,ext=D.mode==="ext",out={};
  const fsw=sp.fsw*1e3,fswMin=fsw*(1-ic.fswTol/100);
  /* bootstrap */
  if(ext){
    const tonMax=(sp.vout/sp.vinMin)/fswMin;
    const qg=D.hs.qg*1e-9;
    const cmin=(qg+ic.ibst*1e-6*tonMax)/ru.dvBoot;
    const rec=snap(Math.max(cmin*3,100e-9),E6,"up");
    out.boot={tonMax,qg,cmin,rec,droop:(qg+ic.ibst*1e-6*tonMax)/rec,vr:ic.vdrv};
  }
  /* soft-start */
  {
    const css=snap(ic.iss*1e-6*sp.tss*1e-3/ic.vref,E12);
    const vrefMin=ic.vref*(1-ic.vrefTol/100),vrefMax=ic.vref*(1+ic.vrefTol/100);
    const cTol=ru.cTolComp/100,iTol=ic.issTol/100;
    const tssNom=css*ic.vref/(ic.iss*1e-6),tssMin=css*(1-cTol)*vrefMin/(ic.iss*1e-6*(1+iTol)),tssMax=css*(1+cTol)*vrefMax/(ic.iss*1e-6*(1-iTol));
    const mHi=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{cout:1}});
    const CmaxRaw=D.cout.reduce((a,r)=>a+r.n*r.c*1e-6*(1+r.tol/100),0);
    const Cnom=realize(D,{vin:sp.vinNom,io:sp.ioutMax,k:{}}).cout.reduce((a,b)=>a+b.n*b.C,0);
    out.ss={css,tssNom,tssMin,tssMax,inrushNom:Cnom*sp.vout/tssNom+sp.ioStart,inrushMax:CmaxRaw*sp.vout/tssMin+sp.ioStart,Cmax:CmaxRaw};
  }
  /* UVLO divider */
  if(sp.uvStart>0&&ic.venR>0){
    const ven=ic.venR,ih=ic.ihys*1e-6;
    let rt,rb;
    if(ih>0&&sp.uvStart>sp.uvStop){rt=(sp.uvStart-sp.uvStop)/ih;rb=rt*ven/(sp.uvStart-ven)}
    else{rb=10e3;rt=rb*(sp.uvStart/ven-1)}
    const Rt=snap(rt,E96),Rb=snap(rb,E96);
    const rt2=Core.rtotPct(D)/100,vt=ic.venTol/100,ht=ic.ihysTol/100;
    const start=(v,a,b)=>v*(1+a/b);
    const startNom=start(ven,Rt,Rb),startMax=start(ven*(1+vt),Rt*(1+rt2),Rb*(1-rt2)),startMin=start(ven*(1-vt),Rt*(1-rt2),Rb*(1+rt2));
    const stopNom=startNom-ih*Rt,stopMin=startMin-ih*(1+ht)*Rt*(1+rt2),stopMax=startMax-ih*(1-ht)*Rt*(1-rt2);
    out.uvlo={Rt,Rb,startNom,startMin,startMax,stopNom,stopMin,stopMax,model:ih>0?"current":"ratio"};
  }
  /* snubber */
  if(ext&&D.snub.on){const s=snubberDesign(D,sp.vinMax);s.pr=D.snub.rsP;out.snub=s}
  return out;
}

function capDerateKey(type){return (Core.CAP_TYPES[type]||Core.CAP_TYPES.mlcc).derate}
function stressTable(D,R,gi){
  const sp=D.specs,ru=D.rules,ic=D.ic,ind=D.ind,ext=D.mode==="ext",rows=[];
  const add=(part,param,applied,rated,der,unit,dig)=>{
    const lim=rated*der/100;const u=applied/lim;
    rows.push({part,param,applied,rated,der,lim,unit,util:u,status:!isFinite(u)?"info":u<=1?"ok":applied<=rated?"warn":"bad",dig:dig||3});
  };
  const vsw=sp.vinMax*(1+(D.snub.on&&ext?0.05:ru.swOvershoot/100));
  add(ext?"Controller":"Converter IC","Input voltage",sp.vinMax,ic.vinMax,ru.drIcV,"V");
  if(ext){
    for(const [nm,f] of [["High-side MOSFET",D.hs],["Low-side MOSFET",D.ls]]){
      add(nm,"Vds incl. overshoot",vsw,f.vds,ru.drMosV,"V");
      add(nm,"Drain current (peak)",gi.ipk.max,f.id,ru.drMosI,"A");
    }
    const tH=R.rows.find(r=>r.id==="tjHs"),tL=R.rows.find(r=>r.id==="tjLs");
    if(tH)rows.push({part:"High-side MOSFET",param:"Junction temperature",applied:tH.eva.max,rated:D.hs.tjmax,der:null,lim:Math.min(ru.tjLim,D.hs.tjmax),unit:"°C",util:tH.eva.max/Math.min(ru.tjLim,D.hs.tjmax),status:tH.status,dig:3});
    if(tL)rows.push({part:"Low-side MOSFET",param:"Junction temperature",applied:tL.eva.max,rated:D.ls.tjmax,der:null,lim:Math.min(ru.tjLim,D.ls.tjmax),unit:"°C",util:tL.eva.max/Math.min(ru.tjLim,D.ls.tjmax),status:tL.status,dig:3});
  }else{
    add("Converter IC","Output current",sp.ioutMax,ic.ioutMax,100,"A");
  }
  add("Inductor","RMS current",gi.irms.max,ind.irms,ru.drIndI,"A");
  rows.push({part:"Inductor",param:"Peak vs hot Isat",applied:gi.ipk.max,rated:ind.isat,der:null,lim:ind.isat*(1-ind.isatHot/100)/(1+ru.isatMargin/100),unit:"A",util:gi.ipk.max/(ind.isat*(1-ind.isatHot/100)/(1+ru.isatMargin/100)),status:gi.ipk.max<=ind.isat*(1-ind.isatHot/100)/(1+ru.isatMargin/100)?"ok":gi.ipk.max<=ind.isat*(1-ind.isatHot/100)?"warn":"bad",dig:3});
  const ripOut=(R.rows.find(r=>r.id==="vrip")||{eva:{max:0}}).eva.max,ripIn=(R.rows.find(r=>r.id==="vinrip")||{eva:{max:0}}).eva.max;
  D.cout.forEach((r,i)=>{if(!(r.n>0))return;const nm=`Output C${i+1}${r.pn?" "+r.pn:""}`;
    add(nm,"Voltage",R.vo.max+ripOut/2+sp.vout*sp.dvTran/100,r.vr,ru[capDerateKey(r.type)],"V");
    add(nm,"Ripple current per cap",R.capOut[i].max,r.irmsC,ru.drCapI,"A");});
  D.cin.forEach((r,i)=>{if(!(r.n>0))return;const nm=`Input C${i+1}${r.pn?" "+r.pn:""}`;
    add(nm,"Voltage",sp.vinMax+ripIn/2,r.vr,ru[capDerateKey(r.type)],"V");
    add(nm,"Ripple current per cap",R.capIn[i].max,r.irmsC,ru.drCapI,"A");});
  if(R.circuits.snub){const s=R.circuits.snub;add("Snubber resistor","Power",s.p,s.pr,ru.drResP,"W")}
  return rows;
}

return {run,cornerText,PARAM_LABEL,snubberDesign};
})();
if(typeof module!=="undefined")module.exports=WCA;
</script>
<script>/* ===================== Formatting and SVG plots ===================== */
"use strict";
const Fmt=(function(){
  const PFX=[[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"],[1e-12,"p"]];
  function si(v,unit,d){
    d=d||3;if(v==null||!isFinite(v))return "—";
    if(v===0)return "0 "+unit;
    const a=Math.abs(v);
    for(const [m,p] of PFX){if(a>=m*0.9995){return (+(v/m).toPrecision(d))+" "+p+unit}}
    return (+(v/1e-12).toPrecision(d))+" p"+unit;
  }
  const n=(v,d)=>v==null||!isFinite(v)?"—":(+v.toPrecision(d||3)).toString();
  const fx=(v,d)=>v==null||!isFinite(v)?"—":v.toFixed(d==null?1:d);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  return {si,n,fx,esc};
})();

const Plot=(function(){
  const {esc}=Fmt;
  function niceTicks(lo,hi,count){
    const span=hi-lo;if(!(span>0))return [lo];
    const step0=span/(count||5);const mag=Math.pow(10,Math.floor(Math.log10(step0)));
    const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0)||10*mag;
    const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+step*1e-6;v+=step)out.push(+v.toPrecision(10));return out;
  }
  function freqLabel(f){return f>=1e6?(f/1e6)+"M":f>=1e3?(f/1e3)+"k":String(f)}
  /* opts: {w,h,xlog,ylog,xmin,xmax,ymin,ymax,xlabel,ylabel,xfmt,yfmt,series:[{x,y,color,width,dash,label,opacity}],bands:[{x,lo,hi,color}],hlines:[{y,color,label,dash}],vlines:[{x,color,label,dash}],legend:true} */
  function draw(o){
    const W=o.w||640,H=o.h||240,ml=o.ml||52,mr=o.mr||14,mt=o.mt||12,mb=o.mb||36,pw=W-ml-mr,ph=H-mt-mb;
    const xs=[],ys=[];
    (o.series||[]).forEach(s=>s.x.forEach((x,i)=>{const y=s.y[i];if(isFinite(x)&&isFinite(y)){xs.push(x);ys.push(y)}}));
    (o.bands||[]).forEach(b=>b.x.forEach((x,i)=>{if(isFinite(b.lo[i]))ys.push(b.lo[i]);if(isFinite(b.hi[i]))ys.push(b.hi[i])}));
    (o.hlines||[]).forEach(h=>ys.push(h.y));
    let xmin=o.xmin!=null?o.xmin:Math.min(...xs),xmax=o.xmax!=null?o.xmax:Math.max(...xs);
    let ymin=o.ymin!=null?o.ymin:Math.min(...ys),ymax=o.ymax!=null?o.ymax:Math.max(...ys);
    if(!isFinite(xmin)||!isFinite(xmax)||!isFinite(ymin)||!isFinite(ymax))return `<svg viewBox="0 0 ${W} ${H}" width="100%"></svg>`;
    if(ymin===ymax){ymin-=1;ymax+=1}
    if(!o.ylog&&o.ymin==null){const pad=(ymax-ymin)*0.06;ymin-=pad;ymax+=pad}
    const lx=v=>o.xlog?Math.log10(v):v,ly=v=>o.ylog?Math.log10(v):v;
    const X=v=>ml+(lx(v)-lx(xmin))/(lx(xmax)-lx(xmin))*pw,Y=v=>mt+(ly(ymax)-ly(v))/(ly(ymax)-ly(ymin))*ph;
    const cx=v=>Math.max(ml,Math.min(ml+pw,X(v))),cy=v=>Math.max(mt-2,Math.min(mt+ph+2,Y(v)));
    let g=`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="var(--plot-bg)"/>`;
    /* x grid */
    if(o.xlog){
      for(let d=Math.floor(Math.log10(xmin));d<=Math.ceil(Math.log10(xmax));d++){
        for(let m=1;m<10;m++){const v=m*Math.pow(10,d);if(v<xmin*0.999||v>xmax*1.001)continue;
          g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt+ph}" stroke="var(--grid)" stroke-width="${m===1?1:0.5}" opacity="${m===1?1:0.6}"/>`;
          if(m===1)g+=`<text x="${X(v)}" y="${mt+ph+15}" text-anchor="middle" fill="var(--muted)">${o.xfmt?o.xfmt(v):freqLabel(v)}</text>`}
      }
    }else{
      for(const v of niceTicks(xmin,xmax,o.xticks||6)){g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt+ph}" stroke="var(--grid)" stroke-width="1"/><text x="${X(v)}" y="${mt+ph+15}" text-anchor="middle" fill="var(--muted)">${o.xfmt?o.xfmt(v):+v.toPrecision(4)}</text>`}
    }
    /* y grid */
    if(o.ylog){
      for(let d=Math.floor(Math.log10(ymin));d<=Math.ceil(Math.log10(ymax));d++){const v=Math.pow(10,d);if(v<ymin*0.999||v>ymax*1.001)continue;
        g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)">${o.yfmt?o.yfmt(v):v}</text>`}
    }else{
      for(const v of niceTicks(ymin,ymax,o.yticks||5)){g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)">${o.yfmt?o.yfmt(v):+v.toPrecision(4)}</text>`}
    }
    /* bands */
    for(const b of o.bands||[]){
      const top=b.x.map((x,i)=>`${X(x).toFixed(1)},${cy(b.hi[i]).toFixed(1)}`),bot=b.x.map((x,i)=>`${X(x).toFixed(1)},${cy(b.lo[i]).toFixed(1)}`).reverse();
      g+=`<polygon points="${top.concat(bot).join(" ")}" fill="var(${b.color||"--band"})" opacity="${b.opacity||0.6}"/>`;
    }
    for(const h of o.hlines||[]){if(h.y<ymin||h.y>ymax)continue;g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="var(${h.color||"--muted"})" stroke-width="1.2" ${h.dash!==false?'stroke-dasharray="5 4"':""}/>`+(h.label?`<text x="${ml+pw-4}" y="${Y(h.y)-5}" text-anchor="end" fill="var(${h.color||"--muted"})">${esc(h.label)}</text>`:"")}
    for(const v of o.vlines||[]){if(!isFinite(v.x)||v.x<xmin||v.x>xmax)continue;g+=`<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${mt}" y2="${mt+ph}" stroke="var(${v.color||"--muted"})" stroke-width="1.2" stroke-dasharray="4 4"/>`+(v.label?`<text x="${X(v.x)+4}" y="${mt+12}" fill="var(${v.color||"--muted"})">${esc(v.label)}</text>`:"")}
    /* series */
    for(const s of o.series||[]){
      let d="",pen=false;
      s.x.forEach((x,i)=>{const y=s.y[i];if(!isFinite(x)||!isFinite(y)||x<xmin||x>xmax||(o.ylog&&y<=0)){pen=false;return}d+=(pen?"L":"M")+X(x).toFixed(1)+","+cy(y).toFixed(1);pen=true});
      g+=`<path d="${d}" fill="none" stroke="var(${s.color||"--copper"})" stroke-width="${s.width||2}" ${s.dash?'stroke-dasharray="6 4"':""} opacity="${s.opacity||1}" stroke-linejoin="round"/>`;
    }
    for(const p of o.points||[]){if(!isFinite(p.x)||!isFinite(p.y))continue;g+=`<circle cx="${X(p.x)}" cy="${cy(p.y)}" r="3.5" fill="var(${p.color||"--copper"})"/>`+(p.label?`<text x="${X(p.x)+6}" y="${cy(p.y)-6}" fill="var(${p.color||"--copper"})">${esc(p.label)}</text>`:"")}
    g+=`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="none" stroke="var(--line)"/>`;
    if(o.xlabel)g+=`<text x="${ml+pw}" y="${H-2}" text-anchor="end" fill="var(--muted)">${esc(o.xlabel)}</text>`;
    if(o.ylabel)g+=`<text x="12" y="${mt+ph/2}" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 12 ${mt+ph/2})">${esc(o.ylabel)}</text>`;
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria||o.ylabel||"plot")}">${g}</svg>`;
  }
  function legend(items){return `<div class="plegend">${items.map(i=>`<span><i style="background:var(${i.color});${i.dash?"background:repeating-linear-gradient(90deg,var("+i.color+") 0 5px,transparent 5px 8px);":""}${i.band?"height:9px;opacity:.6;":""}"></i>${esc(i.label)}</span>`).join("")}</div>`}
  return {draw,legend,niceTicks};
})();

/* ===================== Result views shared by the Results tab and the report ===================== */
"use strict";
const Views=(function(){
const {si,n,fx,esc}=Fmt;
const LAB={ok:"Pass",warn:"Check",bad:"Fail",info:"Info"};
const chip=s=>`<span class="chip ${s}">${LAB[s]||s}</span>`;
const BANKC=["--solder","--ok","--warn","--violet","--bad"];

function val(r,x){const s=r.scale||1;if(x==null||!isFinite(x))return "—";const v=x*s;return (+v.toPrecision(r.dig||3)).toString()}
function wcaTable(R,opts){
  opts=opts||{};
  const rows=R.rows.filter(r=>!opts.filter||opts.filter(r));
  return `<div class="scroll"><table class="t wca"><thead><tr><th>Parameter</th><th>Nominal</th><th>RSS range</th><th>EVA range</th><th>Limit</th><th>Result</th></tr></thead><tbody>${
    rows.map(r=>`<tr class="st-${r.status}"><td><b>${esc(r.label)}</b>${r.unit?` <span class="u">${esc(r.unit)}</span>`:""}${opts.corners!==false&&r.corner?`<div class="sub">Worst: ${esc(r.corner)}</div>`:""}</td>
      <td>${val(r,r.nom)}</td><td>${r.rss?val(r,r.rss.lo)+" – "+val(r,r.rss.hi):"—"}</td><td>${val(r,r.eva.min)} – ${val(r,r.eva.max)}</td>
      <td class="lim">${esc(r.limitText||"—")}</td><td>${chip(r.status)}</td></tr>`).join("")}</tbody></table></div>`;
}
function stressTable(R){
  return `<div class="scroll"><table class="t"><thead><tr><th>Part</th><th>Stress</th><th>Applied</th><th>Rating</th><th>Derating</th><th>Derated limit</th><th>Use</th><th>Result</th></tr></thead><tbody>${
    R.stress.map(s=>`<tr class="st-${s.status}"><td>${esc(s.part)}</td><td>${esc(s.param)}</td><td>${n(s.applied)} ${esc(s.unit)}</td><td>${n(s.rated)} ${esc(s.unit)}</td><td>${s.der!=null?s.der+" %":"—"}</td><td>${n(s.lim)} ${esc(s.unit)}</td>
      <td><span class="meter"><i style="width:${Math.min(100,s.util*100).toFixed(0)}%" class="m-${s.status}"></i></span>${fx(s.util*100,0)} %</td><td>${chip(s.status)}</td></tr>`).join("")}</tbody></table></div>`;
}
function bode(R,D,opts){
  opts=opts||{};
  const L=R.loop,sw=L.sw,fsw=D.specs.fsw*1e3;
  const magDb=sw.mag.map(x=>20*Math.log10(x));
  const bands=[{x:L.gridC,lo:L.env.magLo,hi:L.env.magHi}];
  const gain=Plot.draw({w:640,h:opts.h||210,xlog:true,xmin:10,xmax:fsw,ymin:-60,ymax:Math.min(120,Math.max(40,Math.ceil(Math.max(...magDb.filter(isFinite))/20)*20)),ylabel:"Gain (dB)",
    series:[{x:sw.f,y:magDb,color:"--copper",width:2.2}].concat(opts.parts?[{x:sw.f,y:sw.gpm.map(x=>20*Math.log10(x)),color:"--solder",width:1.4,dash:true},{x:sw.f,y:sw.gcm.map(x=>20*Math.log10(x)),color:"--ok",width:1.4,dash:true}]:[]),
    bands,hlines:[{y:0,color:"--muted",dash:false}],vlines:[{x:L.nom.fc,color:"--copper",label:`fc ${si(L.nom.fc,"Hz")}`},{x:fsw/2,color:"--muted",label:"fsw/2"}],aria:"Loop gain magnitude"});
  const ph=Plot.draw({w:640,h:opts.h||190,xlog:true,xmin:10,xmax:fsw,ymin:-270,ymax:90,yticks:6,ylabel:"Phase (°)",xlabel:"Frequency (Hz)",
    series:[{x:sw.f,y:sw.ph,color:"--copper",width:2.2}].concat(opts.parts?[{x:sw.f,y:sw.gpp,color:"--solder",width:1.4,dash:true},{x:sw.f,y:sw.gcp,color:"--ok",width:1.4,dash:true}]:[]),
    bands:[{x:L.gridC,lo:L.env.phLo,hi:L.env.phHi}],hlines:[{y:-180,color:"--bad",label:"−180°"}],vlines:[{x:L.nom.fc,color:"--copper",label:`PM ${fx(L.nom.pm,0)}°`}],aria:"Loop gain phase"});
  const items=[{color:"--copper",label:"Loop gain T, nominal"},{color:"--band",label:`All ${L.gl._n} worst-case corners`,band:true}];
  if(opts.parts)items.push({color:"--solder",label:"Power stage",dash:true},{color:"--ok",label:"Compensator",dash:true});
  return gain+ph+Plot.legend(items);
}
function zout(R,D){
  const Z=R.plots.zout;
  const series=[{x:Z.grid,y:Z.total,color:"--copper",width:2.4}].concat(Z.rows.map((r,i)=>({x:Z.grid,y:r,color:BANKC[i%BANKC.length],width:1.3,dash:true})));
  return Plot.draw({w:640,h:230,xlog:true,ylog:true,ylabel:"|Z| (Ω)",xlabel:"Frequency (Hz)",yfmt:v=>si(v,"Ω",2).replace(" ",""),series,bands:[{x:Z.grid,lo:Z.lo,hi:Z.hi}],vlines:[{x:D.specs.fsw*1e3,label:"fsw"}],aria:"Output capacitor bank impedance"})+
    Plot.legend([{color:"--copper",label:"Output bank, nominal"},{color:"--band",label:"Min–max over tolerance",band:true}].concat(D.cout.map((r,i)=>({color:BANKC[i%BANKC.length],dash:true,label:`C${i+1}: ${r.n}× ${r.c} µF ${(Core.CAP_TYPES[r.type]||{}).label||""}`}))));
}
function ripple(R,D){
  const P=R.plots.rippleOut,T=1/P.fsw,N=P.nom.length,t=P.nom.map((_,i)=>i/N*T*1e6);
  return Plot.draw({w:640,h:200,ylabel:"Output ripple (mV)",xlabel:"Time (µs), one switching period",series:[{x:t,y:P.nom.map(v=>v*1e3),color:"--copper"},{x:t,y:P.worst.map(v=>v*1e3),color:"--solder",dash:true}],aria:"Output ripple waveform"})+
    Plot.legend([{color:"--copper",label:`Nominal ${fx((Math.max(...P.nom)-Math.min(...P.nom))*1e3,2)} mV pk-pk`},{color:"--solder",dash:true,label:`Worst case ${fx((Math.max(...P.worst)-Math.min(...P.worst))*1e3,2)} mV pk-pk`}]);
}
function tran(R,D){
  const P=R.plots.tran,lim=D.specs.vout*D.specs.dvTran/100*1e3;
  return Plot.draw({w:640,h:220,ylabel:"ΔVout (mV)",xlabel:"Time after load step (µs)",series:[{x:P.nom.t.map(x=>x*1e6),y:P.nom.v.map(v=>v*1e3),color:"--copper"},{x:P.worst.t.map(x=>x*1e6),y:P.worst.v.map(v=>v*1e3),color:"--solder",dash:true}],
    hlines:[{y:-lim,color:"--bad",label:`−${fx(lim,0)} mV limit`},{y:lim,color:"--bad"}],xmin:-P.nom.t.length&&Math.min(P.nom.t[0],P.worst.t[0])*1e6,aria:"Load step response"})+
    Plot.legend([{color:"--copper",label:`Nominal, ${fx(P.nom.dev*1e3,1)} mV`},{color:"--solder",dash:true,label:`Worst corner, ${fx(P.worst.dev*1e3,1)} mV`}]);
}
function mb(R,D){
  const P=R.plots.mb;if(!P)return "";
  return Plot.draw({w:640,h:220,xlog:true,ylog:true,ylabel:"|Z| (Ω)",xlabel:"Frequency (Hz)",yfmt:v=>si(v,"Ω",2).replace(" ",""),

    ${eq("ΔI<sub>L</sub>",`(V<sub>in</sub> − V<sub>out</sub>)·D / (L·f<sub>sw</sub>)`,`${fx(dInom,2)} A nominal L at ${sp.vinMax} V; ${rv("dI","max")} worst case`)}

    ${eq("I<sub>L,rms</sub>",`√(I<sub>out</sub>² + ΔI<sub>L</sub>²/12)`,`${rv("irmsL","max")} worst case`)}
    <h3>Output capacitors</h3>
    <p>${D.cout.map((r,i)=>`C${i+1}: ${r.n} × ${r.c} µF ${(Core.CAP_TYPES[r.type]||{}).label||""}${r.pn?` (<span class="mono">${esc(r.pn)}</span>)`:""}`).join("; ")}. Effective capacitance after DC bias ${fx(Ct,0)} µF nominal.</p>
    <figure>${Views.zout(R,D)}<figcaption>Impedance of each output capacitor group and of the combined bank. The shaded band covers capacitance and ESR tolerance, temperature and end of life.</figcaption></figure>
    <figure>${Views.ripple(R,D)}<figcaption>Output ripple over one switching period at full load, nominal and worst-case corner (${esc(row("vrip").corner)}).</figcaption></figure>
    <table class="t"><thead><tr><th>Group</th><th>Ripple current per part, nominal</th><th>Worst case</th><th>Rating</th></tr></thead><tbody>${D.cout.map((r,i)=>`<tr><td>Output C${i+1}</td><td>${si(R.capOut[i].nom,"A")}</td><td>${si(R.capOut[i].max,"A")}</td><td>${r.irmsC} A</td></tr>`).join("")}</tbody></table>
    <h3>Input capacitors</h3>

    ${Views.wcaTable(R,{filter:r=>["fc","pm","gm","qp"].includes(r.id)})}

  /* ---------- 8 transient ---------- */

  /* ---------- 11 supporting ---------- */
  const c=R.circuits;
  out.push(`<section>${H("Supporting circuits")}
    ${c.boot?`<h3>Bootstrap capacitor</h3>${eq("C<sub>boot,min</sub>",`(Q<sub>g,HS</sub> + I<sub>leak</sub>·t<sub>on,max</sub>) / ΔV<sub>boot</sub> = (${si(c.boot.qg,"C")} + ${ic.ibst} µA·${si(c.boot.tonMax,"s")}) / ${ru.dvBoot} V`,si(c.boot.cmin,"F"))}<p>Use <b>${si(c.boot.rec,"F")}</b> X7R rated at least ${Math.ceil(c.boot.vr*2)} V; droop per cycle is then ${si(c.boot.droop,"V")}.</p>`:""}
    <h3>Soft-start</h3>
    ${eq("C<sub>ss</sub>",`I<sub>ss</sub>·t<sub>ss</sub> / V<sub>ref</sub> = ${ic.iss} µA·${sp.tss} ms / ${ic.vref} V`,si(c.ss.css,"F")+" (E12)")}

      <p>Start threshold ${fx(c.uvlo.startMin,2)} – ${fx(c.uvlo.startMax,2)} V${c.uvlo.model==="current"?`, stop threshold ${fx(c.uvlo.stopMin,2)} – ${fx(c.uvlo.stopMax,2)} V`:""}, including EN threshold, hysteresis current and resistor tolerances.</p>`:""}
    ${c.snub?`<h3>Switch-node snubber</h3>${eq("f<sub>ring</sub>",`1 / (2π·√(L<sub>loop</sub>·C<sub>oss</sub>)) = 1 / (2π·√(${D.snub.lloop} nH·${D.ls.coss} pF))`,si(c.snub.fr,"Hz"))}${eq("R<sub>s</sub>",`√(L<sub>loop</sub>/C<sub>oss</sub>)`,si(c.snub.Rs,"Ω"))}${eq("C<sub>s</sub>","3·C<sub>oss</sub>",si(c.snub.Cs,"F"))}${eq("P<sub>snub</sub>",`C<sub>s</sub>·V<sub>in,max</sub>²·f<sub>sw</sub>`,si(c.snub.p,"W"))}<p class="muted">Confirm the ring frequency on the bench and adjust: the loop inductance is an estimate.</p>`:""}
  </section>`);

  /* ---------- 12 stress ---------- */
  out.push(`<section>${H("Stress and derating")}<p>Applied stress is the worst case from the analysis. Switch-node voltage includes ${D.snub.on&&ext?"5 % residual overshoot with the snubber fitted":ru.swOvershoot+" % overshoot"}.</p>${Views.stressTable(R)}</section>`);

  /* ---------- 13 WCA ---------- */
  out.push(`<section>${H("Worst-case results")}<p>All results, with the corner that produced each worst case.</p>${Views.wcaTable(R)}</section>`);

  /* ---------- 14 open items ---------- */
  const recs=[];
  issues.forEach(i=>recs.push(`<li>${Views.chip(i.status)} <b>${esc(i.label)}</b>: ${esc(i.limitText||"")}</li>`));
  unverified.forEach(p=>recs.push(`<li><span class="chip warn">Check</span> <b>${esc(p.ref)}</b>: confirm parameters against the datasheet.</li>`));

  out.push(`<section>${H("Open items")}
    ${recs.length?`<ul class="issues">${recs.join("")}</ul>`:"<p>None.</p>"}
    <h3>Verification on hardware</h3>
    <ul class="assume"><li>Measure loop gain with a network analyser at Vin min and max, at light and full load, and at temperature extremes; compare with the worst-case band above.</li>
    <li>Capture load-step response at the specified slew rate and switch-node ringing at Vin max.</li><li>Thermal test at ${sp.tMax} °C ambient with the final layout to confirm RθJA.</li>
    <li>Check start-up into full load and into the maximum output capacitance; confirm the current limit does not trip.</li></ul>
  </section>`);
  return `<article class="report">${out.join("")}<footer class="rp-foot">Generated by Buck Designer on ${date}. Results are calculations from the models and values stated above and do not replace measurement.</footer></article>`;
}

function partsList(S,D){

/* ---------- state ---------- */
function merge(def,sv){
  if(Array.isArray(def))return Array.isArray(sv)?sv:def;
  if(def&&typeof def==="object"){const o={};for(const k in def)o[k]=merge(def[k],sv&&typeof sv==="object"?sv[k]:undefined);
    if(sv&&typeof sv==="object")for(const k in sv)if(!(k in o))o[k]=sv[k];return o}
  return sv===undefined||sv===null?def:sv;
}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  const ex=Model.example();
  const st=s&&s.v===2?merge(ex,s):ex;
  for(const id in st.parts){const p=st.parts[id];if(!p.src||!Object.keys(p.src).length){p.src={};for(const k in p.vals)p.src[k]="ex"}}
  for(const b of ["cout","cin"])st[b].forEach(r=>{if(!r.src){r.src={};Model.CAP_KEYS.forEach(k=>r.src[k]="ex")}});
  return st;
}

function target(spec){const [kind,ref]=spec.split(/:(.+)/);return kind==="part"?S.parts[ref]:resolve(ref+".x").obj}
function applyCapType(r,type,force){

/* ---------- Mouser lookup ---------- */
function parseDesc(kind,d){
  const vals={},hints=[];
  const all=(re,sc)=>[...d.matchAll(re)].map(m=>parseFloat(m[1])*(sc||1));
  const volts=all(/(\d+(?:\.\d+)?)\s*V(?:DC)?\b/g),amps=all(/(\d+(?:\.\d+)?)\s*A\b/g),mOhm=all(/(\d+(?:\.\d+)?)\s*m\s?Ohms?\b/gi);
  const uH=[...all(/(\d+(?:\.\d+)?)\s*[uµ]H\b/gi),...all(/(\d+(?:\.\d+)?)\s*nH\b/gi,1e-3)];
  const uF=[...all(/(\d+(?:\.\d+)?)\s*[uµ]F\b/gi),...all(/(\d+(?:\.\d+)?)\s*nF\b/gi,1e-3),...all(/(\d+(?:\.\d+)?)\s*pF\b/gi,1e-6)];
  const pct=all(/(\d+(?:\.\d+)?)\s*%/g);
  if(kind==="fet"){if(volts.length)vals.vds=volts[0];if(amps.length)vals.id=amps[0];
    if(/P-?Ch/i.test(d))hints.push("This is a P-channel part. The loss model assumes N-channel MOSFETs.");
    if(mOhm.length)hints.push(`Description quotes ${mOhm[0]} mΩ. Use the maximum Rds(on) at your gate drive voltage from the datasheet.`);
    hints.push("Description current is usually a Tc = 25 °C rating. Check the derated Id in the datasheet.")}
  else if(kind==="ind"){if(uH.length)vals.L=uH[0];if(pct.length)vals.ltol=pct[0];
    if(mOhm.length){vals.dcr=mOhm[0];hints.push(`DCR ${mOhm[0]} mΩ from the description may be typical. Use the maximum from the datasheet.`)}
    if(amps.length)hints.push(`Description gives ${amps.join(" A, ")} A. Check whether that is Isat or Irms before entering it.`)}
  else if(kind==="cap"){if(uF.length)vals.c=uF[0];if(volts.length)vals.vr=volts[0];if(pct.length)vals.tol=pct[0];
    let type=null;if(/polymer/i.test(d))type="poly";else if(/tantalum/i.test(d))type="tant";else if(/alumin(i)?um|electrolytic/i.test(d))type="alu";else if(/film/i.test(d))type="film";else if(/ceramic|mlcc|X5R|X7R|X6S|X7S|C0G|NP0/i.test(d))type="mlcc";
    vals._type=type;
    const diel=(d.match(/\b(X5R|X7R|X6S|X7S|X7T|X8R|C0G|NP0|Y5V)\b/i)||[])[1];
    if(diel&&!/C0G|NP0/i.test(diel))hints.push(`${diel.toUpperCase()} ceramic: set DC-bias loss from the manufacturer's curve at your voltage. ESR and ESL are rarely in the PDF.`);
    if(type==="poly"||type==="alu"||type==="tant")hints.push("Take ESR and ripple current from the datasheet at your frequency and temperature.")}
  else{if(volts.length)hints.push(`Voltages in description: ${volts.join(" V, ")} V. Take the maximum input voltage from the datasheet.`);
    if(amps.length)hints.push(`Current in description: ${amps[0]} A. Check the current limit in the datasheet.`)}
  return {vals,hints};
}
const busy={};
async function lookup(spec,btn){
  const o=target(spec),kind=spec.startsWith("cap:")?"cap":LIBTYPE[spec.split(":")[1]];
  const stId=spec.startsWith("cap:")?"st-"+o.id:"st-"+spec.split(":")[1];
  const st=()=>document.getElementById(stId);
  const pn=(o.pn||"").trim();
  if(!pn){const s=st();s.className="status err";s.textContent="Enter a part number first.";return}
  if(busy[spec])return;busy[spec]=true;btn.disabled=true;btn.textContent="Searching…";
  const s0=st();s0.className="status";s0.textContent=`Searching Mouser for ${pn}…`;
  try{
    let res;
    try{res=await fetch(MOUSER_API+encodeURIComponent(pn))}
    catch(e){throw {msg:IN_CLAUDE?"Mouser lookup works on the mxdesign.uk version of this tool. Here, enter values from the datasheet.":"Couldn't reach the lookup service. Check your connection and try again."}}
    const r=await res.json().catch(()=>({}));
    if(!res.ok)throw {msg:r.error?`Lookup failed: ${r.error}`:`Lookup service returned ${res.status}.`};
    if(!r.found){o.mouser=null;save();renderDesign();const s=st();s.className="status err";s.textContent=`${pn} isn't listed on Mouser. Check the part number, or enter values from the datasheet.`;return}
    const {vals,hints}=parseDesc(kind,r.description||"");
    o.src=o.src||{};
    if(kind==="cap"&&vals._type&&vals._type!==o.type){applyCapType(o,vals._type,true);["esl","tol","temp","eol","esrLo","esrHi"].forEach(k=>o.src[k]="mouser")}
    delete vals._type;
    const tgt=kind==="cap"?o:o.vals;let cnt=0;
    for(const k in vals){if(k in tgt&&isFinite(vals[k])){tgt[k]=vals[k];o.src[k]="mouser";cnt++}}
    if(r.mpn)o.pn=String(r.mpn).toUpperCase();
    o.verified=false;
    o.mouser={mpn:r.mpn||pn,manufacturer:r.manufacturer||"",description:r.description||"",datasheet:r.datasheet||"",productUrl:r.productUrl||"",stock:r.stock,lifecycle:r.lifecycle||"",priceBreaks:Array.isArray(r.priceBreaks)?r.priceBreaks:[],hints};
    save();renderDesign();schedule();
    const s=st();s.className="status";s.textContent=(cnt?`Filled ${cnt} value${cnt>1?"s":""} from the description. `:"")+"Enter the rest from the datasheet, then tick it as checked."+(r.otherMatches?` Mouser listed ${r.otherMatches} similar part${r.otherMatches>1?"s":""}; confirm the suffix.`:"");
  }catch(e){const s=st();if(s){s.className="status err";s.textContent=(e&&e.msg)||"Lookup failed. Try again."}}
  finally{busy[spec]=false;const b2=document.querySelector(`[data-look="${spec}"]`);if(b2){b2.disabled=false;b2.textContent="Look up"}}
}
