function saveToLib(spec){
  const o=target(spec),isCap=spec.startsWith("cap:"),t=isCap?"cap":LIBTYPE[spec.split(":")[1]];
  const vals={};
  if(isCap){for(const k of ["c","esr","esl","vr","irmsC","tol","temp","eol","esrLo","esrHi"])vals[k]=o[k]}
  else for(const k in o.vals)vals[k]=o.vals[k];
  const m=o.mouser||{};
  const e={pn:o.pn,manufacturer:m.manufacturer||"",description:m.description||"",datasheet:m.datasheet||"",type:isCap?o.type:undefined,vals,saved:new Date().toISOString().slice(0,10)};
  LIB[t]=(LIB[t]||[]).filter(x=>x.pn!==o.pn);LIB[t].push(e);LIB[t].sort((a,b)=>a.pn.localeCompare(b.pn));
  saveLib();renderDesign();toast(`${o.pn} saved to your library`);
}
function useLib(kind,ref,i){
  const t=kind==="cap"?"cap":LIBTYPE[ref];const e=(LIB[t]||[])[i];if(!e)return;
  const o=kind==="cap"?resolve(ref+".x").obj:S.parts[ref];
  o.pn=e.pn;o.src=o.src||{};
  if(kind==="cap"){if(e.type)o.type=e.type;for(const k in e.vals){o[k]=e.vals[k];o.src[k]="lib"}}
  else for(const k in e.vals){if(k in o.vals){o.vals[k]=e.vals[k];o.src[k]="lib"}}
  o.verified=true;
  o.mouser=e.datasheet||e.manufacturer?{mpn:e.pn,manufacturer:e.manufacturer,description:e.description,datasheet:e.datasheet,productUrl:"",lifecycle:"",priceBreaks:[],hints:["Loaded from your library. Look up again for current price, stock and lifecycle."]}:null;
  save();renderDesign();schedule();
}

/* ---------- files ---------- */
let downloads=null;
async function saveFile(name,text,type){
  if(IN_CLAUDE){
    if(!downloads){toast("Saving files isn't available in this view.");return}
    try{await downloads.save({filename:name,data:text})}catch(e){if(e&&e.code!=="declined"&&e.code!=="cancelled")toast("The file was not saved.")}
    return;
  }
  const url=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const slug=()=>(S.meta.project||"buck-design").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"buck-design";
$("#btn-proj-save").onclick=()=>saveFile(`${slug()}.buck.json`,JSON.stringify({format:"buck-designer-project",version:2,state:S},null,2),"application/json");
$("#btn-proj-open").onclick=()=>$("#file-proj").click();
$("#file-proj").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j||j.format!=="buck-designer-project"||!j.state)throw 0;S=merge(Model.example(),j.state);S.v=2;save();renderDesign();schedule(0);toast(`Opened ${S.meta.project||f.name}`)}
  catch(err){toast("That file isn't a Buck Designer project.")}e.target.value=""};
$("#btn-lib-x").onclick=()=>{const n=Object.values(LIB).reduce((s,a)=>s+a.length,0);if(!n){toast("Your library is empty. Check a part and save it first.");return}
  saveFile("buck-parts-library.json",JSON.stringify({format:"buck-designer-library",version:2,parts:LIB},null,2),"application/json")};
$("#btn-lib-i").onclick=()=>$("#file-lib").click();
$("#file-lib").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const parts=j&&j.parts;if(!parts||typeof parts!=="object")throw 0;let c=0;
    for(const t in parts){if(!Array.isArray(parts[t]))continue;LIB[t]=LIB[t]||[];parts[t].forEach(x=>{if(x&&x.pn&&x.vals){LIB[t]=LIB[t].filter(y=>y.pn!==x.pn);LIB[t].push(x);c++}});LIB[t].sort((a,b)=>a.pn.localeCompare(b.pn))}
    saveLib();renderDesign();toast(`Imported ${c} part${c===1?"":"s"}`)}
  catch(err){toast("That file isn't a Buck Designer library.")}e.target.value=""};
$("#btn-reset").onclick=e=>{const b=e.currentTarget;
  if(b.dataset.arm==="1"){S=Model.example();for(const id in S.parts){S.parts[id].src={};for(const k in S.parts[id].vals)S.parts[id].src[k]="ex"}for(const bk of ["cout","cin"])S[bk].forEach(r=>{r.src={};Model.CAP_KEYS.forEach(k=>r.src[k]="ex")});
    save();b.dataset.arm="";b.textContent="New from example";renderDesign();schedule(0);toast("Loaded the example design");return}
  b.dataset.arm="1";b.textContent="Tap again to replace";setTimeout(()=>{b.dataset.arm="";b.textContent="New from example"},3000)};

/* ---------- analysis worker ---------- */
let LAST=null,ERRS=[],runId=0,worker=null,timer=null,running=false;
try{
  const src=document.getElementById("engine").textContent+`
self.onmessage=function(e){try{const S=e.data.S;const D=Model.prepare(S);const R=WCA.run(D);self.postMessage({id:e.data.id,D,R})}catch(err){self.postMessage({id:e.data.id,error:String(err&&err.message||err)})}};`;
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
  worker.onmessage=e=>done(e.data);
  worker.onerror=()=>{worker=null;schedule(0)};
}catch(e){worker=null}
function setRun(txt,busyOn){const r=$("#run");if(r)r.innerHTML=`<span class="dot${busyOn?" busy":""}"></span><span>${esc(txt)}</span>`}
function schedule(delay){
  clearTimeout(timer);
  timer=setTimeout(()=>{
    ERRS=Model.validate(S);
    if(ERRS.length){setRun("Fix inputs to analyse",false);renderActive();return}
    const id=++runId;running=true;setRun("Analysing worst-case corners…",true);
    const payload=JSON.parse(JSON.stringify(S));
    if(worker)worker.postMessage({id,S:payload});
    else setTimeout(()=>{try{const D=Model.prepare(payload);done({id,D,R:WCA.run(D)})}catch(err){done({id,error:String(err&&err.message||err)})}},20);
  },delay==null?350:delay);
}
function done(msg){
  if(msg.id!==runId)return;running=false;
  if(msg.error){setRun("Analysis failed",false);ERRS=["The analysis could not run: "+msg.error+". Check for unusual input values."];renderActive();return}
  LAST={D:msg.D,R:msg.R};ERRS=[];
  const c={ok:0,warn:0,bad:0};LAST.R.rows.forEach(r=>{if(c[r.status]!=null)c[r.status]++});LAST.R.stress.forEach(r=>{if(c[r.status]!=null)c[r.status]++});
  setRun(`${LAST.R.corners.toLocaleString()} corners · ${c.bad} fail · ${c.warn} check`,false);
  renderCompPanel();renderActive();
}

/* ---------- results view ---------- */
function issuesList(R,D){
  const L=[];
  R.rows.filter(r=>r.status==="bad"||r.status==="warn").forEach(r=>L.push({st:r.status,t:r.label,d:`${r.limitText}; worst ${Views.val(r,r.dir==="min"?r.eva.min:r.eva.max)} ${r.unit} at ${r.corner||"—"}`}));
  R.stress.filter(s=>s.status==="bad"||s.status==="warn").forEach(s=>L.push({st:s.status,t:`${s.part}: ${s.param}`,d:`${n(s.applied)} ${s.unit} applied vs ${n(s.lim)} ${s.unit} derated limit`}));
  R.notes.forEach(x=>L.push({st:"warn",t:"Loop",d:x}));
  Report.partsList(S,D).forEach(p=>{
    if(p.life&&/obsolete|end of life|eol|discontinu/i.test(p.life))L.push({st:"bad",t:`${p.ref} lifecycle`,d:`${p.pn}: ${p.life}`});
    if(!p.verified)L.push({st:"warn",t:`${p.ref} not checked`,d:p.example?"Using example values, not a real part":"Values not yet checked against the datasheet"});
  });
  const o={bad:0,warn:1};L.sort((a,b)=>o[a.st]-o[b.st]);
  return L;
}
function renderResults(){
  const el=$("#view-results");
  if(ERRS.length){el.innerHTML=`<div class="panel"><h3>Fix these inputs to run the analysis</h3><ul class="checks" style="margin-top:8px">${ERRS.map(e=>`<li><span class="chip bad">Input</span><div class="t1">${esc(e)}</div></li>`).join("")}</ul></div>`;return}
  if(!LAST){el.innerHTML=`<div class="panel empty">Running the worst-case analysis…</div>`;return}
  const {D,R}=LAST,sp=D.specs,row=id=>R.rows.find(r=>r.id===id);
  const iss=issuesList(R,D);
  const tj=D.mode==="ext"?Math.max(row("tjHs").eva.max,row("tjLs").eva.max):row("tjIc").eva.max;
  const sum=[["Phase margin",`${fx(row("pm").eva.min,0)}°`,`worst · ${fx(row("pm").nom,0)}° nominal`],["Crossover",`${si(row("fc").nom,"Hz")}`,`${si(row("fc").eva.min,"Hz",2)} – ${si(row("fc").eva.max,"Hz",2)}`],
    ["Output ripple",`${fx(row("vrip").eva.max*1e3,1)} mV`,`worst · limit ${sp.vrip} mV`],["Load step",`${fx(row("tran").eva.max*1e3,0)} mV`,`worst · limit ${fx(sp.vout*sp.dvTran*10,0)} mV`],
    ["Efficiency",`${fx(row("eff").nom*100,1)} %`,`${fx(row("eff").eva.min*100,1)} % hot, EOL`],["Hottest junction",`${fx(tj,0)} °C`,`at ${sp.tMax} °C ambient`]];
  el.innerHTML=`
    <div class="summary">${sum.map(s=>`<div><span class="lbl">${s[0]}</span><b>${s[1]}</b><span class="sub">${s[2]}</span></div>`).join("")}</div>
    <section class="block"><h2>Items needing attention</h2><div class="panel">${iss.length?`<ul class="checks">${iss.map(i=>`<li><span class="chip ${i.st}">${{bad:"Fail",warn:"Check"}[i.st]}</span><div><div class="t1">${esc(i.t)}</div><div class="t2">${esc(i.d)}</div></div></li>`).join("")}</ul>`:`<p>No failures or marginal results.</p>`}</div></section>
    <section class="block"><h2>Worst-case analysis</h2><p class="note">EVA: every combination of operating condition and tolerance extreme. RSS: tolerances combined as root-sum-square at the worst operating point. ${R.corners.toLocaleString()} corners.</p><div class="panel">${Views.wcaTable(R)}</div></section>
    <div class="cols">
      <section class="block"><h2>Loop gain</h2><div class="panel">${Views.bode(R,D,{parts:true})}</div></section>
      <section class="block"><h2>Compensation</h2><div class="panel">${Views.compTable(D)}<h4 style="margin:14px 0 6px">Poles and zeros</h4>${Views.polesZeros(D)}</div></section>
      <section class="block"><h2>Output capacitor bank</h2><div class="panel">${Views.zout(R,D)}</div></section>
      <section class="block"><h2>Output ripple</h2><div class="panel">${Views.ripple(R,D)}</div></section>
      <section class="block"><h2>Load step</h2><div class="panel">${Views.tran(R,D)}<dl class="kv" style="margin-top:10px"><dt>Slew-limited bound, release</dt><dd>${si(R.slewBound.release,"V")}</dd><dt>Slew-limited bound, apply</dt><dd>${si(R.slewBound.apply,"V")}</dd></dl></div></section>
      ${D.filter.on?`<section class="block"><h2>Input filter stability</h2><div class="panel">${Views.mb(R,D)}</div></section>`:""}
      <section class="block"><h2>Efficiency</h2><div class="panel">${Views.eff(R,D)}</div></section>
      <section class="block"><h2>Supporting circuits</h2><div class="panel">${Views.circuits(R,D)}</div></section>
    </div>
    <section class="block"><h2>Losses</h2><div class="panel">${Views.lossTable(R,D)}</div></section>
    <section class="block"><h2>Stress and derating</h2><div class="panel">${Views.stressTable(R)}</div></section>`;
}
function renderReport(){
  const el=$("#view-report");
  if(ERRS.length||!LAST){el.innerHTML=`<div class="panel empty">${ERRS.length?"Fix the inputs listed on the Results tab to produce the report.":"Preparing the report…"}</div>`;return}
  el.innerHTML=`<div class="rp-tools tools" style="justify-content:flex-end">${IN_CLAUDE?"":`<button class="btn pri" type="button" id="btn-print">Print or save as PDF</button>`}<button class="btn${IN_CLAUDE?" pri":""}" type="button" id="btn-rep-html" ${IN_CLAUDE&&!downloads?"hidden":""}>Save report (HTML)</button></div>`+Report.build(S,LAST.D,LAST.R);
  const p=$("#btn-print");if(p)p.onclick=()=>window.print();
  $("#btn-rep-html").onclick=()=>{const css=document.getElementById("app-css").textContent;saveFile(`${slug()}-design-report-rev-${(S.meta.rev||"A").replace(/\W+/g,"")}.html`,Report.standalone(el.querySelector(".report").outerHTML,`${S.meta.project} design report`,css),"text/html")};
}

/* ---------- routing ---------- */
const VIEWS=["design","results","report"];
function route(){const h=(location.hash||"").slice(1);return VIEWS.includes(h)?h:"design"}
function renderActive(){
  const v=route();
  VIEWS.forEach(x=>{$("#view-"+x).hidden=x!==v;const a=document.querySelector(`nav.tabs a[href="#${x}"]`);if(a){if(x===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}});
  if(v==="results")renderResults();
  if(v==="report")renderReport();
}
window.addEventListener("hashchange",()=>{renderActive();window.scrollTo(0,0)});

/* ---------- boot ---------- */
renderDesign();renderActive();schedule(0);
if(IN_CLAUDE&&window.claude.use){window.claude.use("downloads").then(d=>{downloads=d;if(route()==="report")renderReport()}).catch(()=>{})}
})();
</script>

</body>
