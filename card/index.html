<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Make a free contact card and share it by QR with any phone. No sign-up, no app.">
<meta name="theme-color" content="#1b1d25">
<title>Cardshare</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardshare">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@800&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one phone-width column, two views behind a segmented switch, taken from the 2023 dark theme. Single dark look by design. */
:root{
  color-scheme:dark;
  --ground:#1b1d25; --panel:#2a2c38; --panel-hi:#343644; --line:#3d4050;
  --ink:#f3f2f8; --ink-soft:#a9a8b8; --ink-dim:#77768a;
  --violet:#7461f2; --violet-hi:#8d7cff; --lime:#c8e62b; --lime-hi:#bfff6b;
  --paper:#ffffff; --paper-ink:#15161c;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand:"Poppins","Arial Black",system-ui,sans-serif;
  --r:22px;
  /* tokens that differ per theme beyond the palette: hairlines, top sheen on raised surfaces, the page glow, text on the accent, focus ring */
  --hair:rgba(255,255,255,.06); --sheen:rgba(255,255,255,.08); --glow:rgba(116,97,242,.22); --on-accent:#fff; --lift:rgba(116,97,242,.8); --focus:var(--lime-hi);
}
:root[data-theme="daylight"]{
  color-scheme:light;
  --ground:#f4f3f8; --panel:#ffffff; --panel-hi:#eceaf4; --line:#d3d0df;
  --ink:#1b1c24; --ink-soft:#5a596a; --ink-dim:#878697;
  --violet:#6654e8; --violet-hi:#5b48e0; --lime:#a9cf12; --lime-hi:#b9f04c;
  --hair:rgba(20,18,40,.08); --sheen:rgba(255,255,255,.7); --glow:rgba(116,97,242,.14); --lift:rgba(102,84,232,.45); --focus:#5b48e0;
}
:root[data-theme="ocean"]{
  --ground:#0f1c22; --panel:#182a32; --panel-hi:#223944; --line:#2f4a57;
  --ink:#eef6f8; --ink-soft:#9bb4bd; --ink-dim:#6c8691;
  --violet:#2fb3c6; --violet-hi:#5fd0e0;
  --glow:rgba(47,179,198,.2); --on-accent:#06222a; --lift:rgba(47,179,198,.55);
}
:root[data-theme="ember"]{
  --ground:#211815; --panel:#2f221d; --panel-hi:#3d2d26; --line:#523c33;
  --ink:#f8f1ec; --ink-soft:#c0a99c; --ink-dim:#8e786c;
  --violet:#f0764a; --violet-hi:#ff9a70;
  --glow:rgba(240,118,74,.18); --on-accent:#2a0f05; --lift:rgba(240,118,74,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--body);
  background-image:radial-gradient(60% 40% at 80% 30%,var(--glow),transparent 70%);background-attachment:fixed}
.app{max-width:440px;margin:0 auto;padding-inline:20px;padding-block:22px 40px;display:flex;flex-direction:column;gap:20px}
.logo{position:relative;align-self:center;font:800 30px/1 var(--brand);letter-spacing:-.05em;color:#8d7cff;padding:14px 6px;display:flex;gap:.28em}
.logo span{position:relative;z-index:1}
.logo::before,.logo::after{content:"";position:absolute;transform:skewX(-20deg)}
.logo::before{background:#c8e62b;left:28%;right:38%;top:22%;bottom:0}
.logo::after{background:#bfff6b;left:45%;right:20%;top:0;bottom:16%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:999px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;color:var(--ink-soft);font:500 13.5px var(--body);padding:10px 6px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel-hi);color:var(--ink);box-shadow:inset 0 1px 0 var(--sheen)}
.seg.pick button[aria-selected="true"]{background:var(--violet);color:var(--on-accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.eyebrow{text-align:center;color:var(--ink-soft);font-size:14px;margin:0}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--sheen)}
.fields{display:flex;flex-direction:column;padding:6px 0}
.field{display:flex;align-items:center;gap:10px;padding:0 18px}
.field + .field{border-top:1px solid var(--hair)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:500 15.5px var(--body);padding:15px 0}
.field input::placeholder{color:var(--ink-dim);font-weight:400}
.field label{color:var(--ink-dim);font-size:12.5px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;padding:15px 18px;font:600 15px var(--body);cursor:pointer;text-decoration:none;color:var(--ink);background:var(--panel-hi);box-shadow:inset 0 1px 0 var(--sheen)}
.btn.primary{background:linear-gradient(180deg,var(--violet-hi),var(--violet));color:var(--on-accent);box-shadow:0 10px 26px -8px var(--lift),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.small{width:auto;padding:9px 14px;font-size:13px}
.note{color:var(--ink-soft);font-size:13px;text-align:center;margin:0;text-wrap:balance}
/* share */
.qrcard{padding:14px 14px 18px;text-align:center}
.qrcard h2{font:600 16px var(--body);margin:2px 0 12px}
.qrbox{background:var(--paper);border-radius:14px;padding:14px;aspect-ratio:1;max-width:100%}
.qrbox svg{display:block;width:100%;height:100%}
.qrbox.empty{background:none;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft)}
.who{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.who .n{font-size:13.5px;color:var(--ink-soft)}
.who .p{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.who .t{font-size:14.5px;color:var(--ink-dim)}
.reveal{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:14px;font-size:13.5px;color:var(--ink-soft)}
.reveal b{color:var(--ink);font-weight:600}
/* top slot: the logo, swapped for the thank-you nudge for a few seconds after a save */
.top{position:relative;min-height:58px;display:flex;align-items:center;justify-content:center}
.tip{flex:1;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--panel);border:1px solid var(--lime);border-radius:999px;animation:pop .35s ease-out}
.tip.out{animation:fade .3s ease-in forwards}
.tip p{flex:1;min-width:0;margin:0;font-size:13.5px;line-height:1.3;color:var(--ink-soft)}
.tip p b{color:var(--ink);font-weight:600}
.tip .btn{flex:none;background:var(--lime-hi);color:var(--paper-ink)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes fade{to{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.tip,.tip.out{animation:none}}
.install{display:flex;align-items:center;gap:14px;padding:14px 18px;width:100%;border:1px dashed var(--line);border-radius:var(--r);background:none;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.install img{flex:none;width:40px;height:40px;border-radius:11px}
.install span{flex:1;min-width:0}
.install strong{display:block;font-weight:600}
.install small{color:var(--ink-soft);font-size:12.5px}
.install i{font-style:normal;color:var(--lime-hi);font-size:20px}
.tipline{align-self:center;display:inline-flex;align-items:center;gap:7px;margin-top:4px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);font-size:12.5px;text-decoration:none;transition:color .2s,border-color .2s}
.tipline svg{width:12px;height:12px;fill:var(--lime-hi)}
.tipline b{color:var(--ink-soft);font-weight:500}
.tipline:hover{color:var(--ink-soft);border-color:var(--lime)}
.sub{margin:4px 4px -10px;color:var(--ink-dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
/* one round chip per link; the picked one drives the QR above */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;border:0;background:none;padding:0;color:var(--ink-soft);font:400 10.5px var(--body);cursor:pointer}
.chip i{font-style:normal;width:46px;height:46px;border-radius:50%;background:var(--panel-hi);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 var(--sheen)}
.chip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--violet);color:var(--on-accent)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:12px}
.seg button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the link picker: a sheet that rises from the bottom of the screen */
.picker{margin:auto auto 0;width:100%;max-width:440px;border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.picker::backdrop{background:rgba(10,11,16,.6)}
.picker-in{display:flex;flex-direction:column;gap:18px;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.picker[open]{animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.picker[open]{animation:none}}
.textbtn{align-self:center;background:none;border:0;padding:6px;color:var(--violet-hi);font:600 13px var(--body);text-decoration:underline;cursor:pointer}
/* theme button beside the logo, and the swatches in its sheet */
.theme-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--sheen)}
.theme-btn svg{width:18px;height:18px}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.swatch i{border:2px solid var(--line);box-shadow:none}
.swatch[aria-checked="true"]{color:var(--ink)}
.swatch[aria-checked="true"] i{border-color:var(--focus)}
</style>
<script>try{var t=localStorage.getItem("cardshare-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>

<main class="app">
  <div class="top">
    <div class="logo" id="logo" aria-label="card share"><span>card</span><span>share</span></div>
    <div class="tip" id="tip" role="status" hidden>
      <p><b id="tip-lead">Saved.</b> Cardshare is free. If it helped, say thanks.</p>
      <a class="btn small" href="https://buy.stripe.com/fZu14mbnDgVS5qx26cawo00" target="_blank" rel="noopener">Buy me a beer</a>
    </div>
    <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="dialog" aria-label="Change theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="seg two" role="tablist" aria-label="Screens">
    <button role="tab" id="tab-edit" data-view="edit" aria-selected="false">My card</button>
    <button role="tab" id="tab-share" data-view="share" aria-selected="true">Share</button>
  </div>

  <!-- 1. your cards and links: Personal, Work and Links share one screen and one Save button -->
  <section class="view" id="view-edit" hidden>
    <p class="eyebrow" id="edit-eyebrow">Create your card</p>
    <div class="seg pick" role="tablist" aria-label="What to edit">
      <button role="tab" id="ek-personal" data-kind="personal" aria-selected="true">Personal</button>
      <button role="tab" id="ek-work" data-kind="work" aria-selected="false">Work</button>
      <button role="tab" id="ek-links" data-kind="links" aria-selected="false">Links</button>
    </div>
    <form class="panel fields" id="card-form" autocomplete="off">
      <div class="field"><input id="f-name" placeholder="Your name"><label for="f-name">Name</label></div>
      <div class="field"><input id="f-title" placeholder="What you do"><label for="f-title">Title</label></div>
      <div class="field"><input id="f-org" placeholder="Company or brand"><label for="f-org">Company</label></div>
      <div class="field"><input id="f-tel" type="tel" inputmode="tel" placeholder="+44 7700 900123"><label for="f-tel">Mobile</label></div>
      <div class="field"><input id="f-email" type="email" inputmode="email" placeholder="you@example.com"><label for="f-email">Email</label></div>
    </form>
    <div class="panel fields" id="link-form" hidden>
      <div class="field"><input id="f-web" inputmode="url" placeholder="yoursite.com" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="f-web">Website</label></div>
      <div class="field"><input id="l-whatsapp" type="tel" inputmode="tel" placeholder="+44 7700 900123" autocomplete="off"><label for="l-whatsapp">WhatsApp</label></div>
      <div class="field"><input id="l-linkedin" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-linkedin">LinkedIn</label></div>
      <div class="field"><input id="l-instagram" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-instagram">Instagram</label></div>
      <div class="field"><input id="l-x" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-x">X</label></div>
      <div class="field"><input id="l-youtube" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-youtube">YouTube</label></div>
      <div class="field"><input id="l-tiktok" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-tiktok">TikTok</label></div>
      <div class="field"><input id="l-facebook" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-facebook">Facebook</label></div>
      <div class="field"><input id="l-telegram" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-telegram">Telegram</label></div>
      <div class="field"><input id="l-spotify" placeholder="paste your Spotify link" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-spotify">Spotify</label></div>
      <div class="field"><input id="l-customLabel" placeholder="e.g. Bookings" autocomplete="off" maxlength="14"><label for="l-customLabel">Link name</label></div>
      <div class="field"><input id="l-customUrl" placeholder="yoursite.com/book" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="l-customUrl">Link</label></div>
    </div>
    <button class="btn primary" id="save-card" type="button">Save</button>
    <p class="note" id="edit-note"></p>
  </section>

  <!-- 2. show a QR: a contact card, or one of your links -->
  <section class="view" id="view-share">
    <div class="panel qrcard">
      <h2 id="qr-title">Personal</h2>
      <div class="qrbox" id="qrbox">
        <div id="qr"></div>
        <span id="empty-msg" hidden></span>
        <button class="btn small" id="empty-btn" type="button" hidden></button>
      </div>
      <div class="who"><span class="n" id="w-name"></span><span class="p" id="w-tel"></span><span class="t" id="w-title"></span></div>
    </div>
    <div class="seg pick" role="tablist" aria-label="What to share">
      <button role="tab" id="sk-personal" data-kind="personal" aria-selected="true">Personal</button>
      <button role="tab" id="sk-work" data-kind="work" aria-selected="false">Work</button>
      <button role="tab" id="sk-links" data-kind="links" aria-selected="false" aria-haspopup="dialog">Links</button>
    </div>
    <p class="note" id="share-help"></p>
    <button class="install" id="install" type="button" aria-expanded="false" aria-controls="install-help" hidden>
      <img src="icons/icon-192.png" alt="" width="40" height="40">
      <span><strong>Add to home screen</strong><small>Open Cardshare like an app, even with no signal</small></span><i aria-hidden="true">+</i>
    </button>
    <div class="reveal" id="install-help" hidden></div>
    <a class="tipline" href="https://buy.stripe.com/fZu14mbnDgVS5qx26cawo00" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3.1 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3.1 1.7-2 3.2-3.1 5.3-3.1 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
      Free to use · <b>Buy me a beer</b>
    </a>
  </section>

  <!-- pops up from the Links button on Share: pick which link the QR shows -->
  <dialog class="picker" id="picker" aria-label="Choose a link to share">
    <div class="picker-in">
      <p class="eyebrow">Which link?</p>
      <div class="chips" id="chips"></div>
      <button class="textbtn" id="picker-edit" type="button">Edit links</button>
    </div>
  </dialog>

  <!-- pops up from the round button beside the logo: pick a colour theme -->
  <dialog class="picker" id="themes" aria-label="Choose a theme">
    <div class="picker-in">
      <p class="eyebrow">Theme</p>
      <div class="chips" id="theme-chips" role="radiogroup" aria-label="Theme"></div>
    </div>
  </dialog>
</main>

<script src="qrcode.js"></script>
<script>
(function(){
  var KEY="cardshare-lite-v2",OLD="cardshare-lite-card";
  var F=["name","title","org","tel","email"],LABEL={personal:"Personal",work:"Work"};
  // k: field name, n: name, m: letters on the chip, u: profile address the username is added to
  var SOC=[{k:"linkedin",n:"LinkedIn",m:"in",u:"https://www.linkedin.com/in/"},{k:"instagram",n:"Instagram",m:"IG",u:"https://www.instagram.com/"},
    {k:"x",n:"X",m:"X",u:"https://x.com/"},{k:"youtube",n:"YouTube",m:"YT",u:"https://www.youtube.com/@"},{k:"tiktok",n:"TikTok",m:"TT",u:"https://www.tiktok.com/@"},
    {k:"facebook",n:"Facebook",m:"fb",u:"https://www.facebook.com/"},{k:"telegram",n:"Telegram",m:"TG",u:"https://t.me/"}];
  var LK=["whatsapp"].concat(SOC.map(function(s){return s.k}),["spotify","customLabel","customUrl"]);
  function blank(){return {name:"",title:"",org:"",tel:"",email:""}}
  function blankLinks(){var o={};LK.forEach(function(k){o[k]=""});return o}
  function copy(o){return JSON.parse(JSON.stringify(o))}
  var data=null,isNew=true;
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&s.cards){data=s;isNew=false}
    else{var o=JSON.parse(localStorage.getItem(OLD)||"null");
      if(o&&o.name){data={web:o.web||"",cards:{personal:Object.assign(blank(),o),work:blank()}};isNew=false}}
  }catch(e){}
  if(!data)data={web:"",cards:{personal:blank(),work:blank()}};
  data.cards.personal=Object.assign(blank(),data.cards.personal);data.cards.work=Object.assign(blank(),data.cards.work);
  var links=blankLinks();LK.forEach(function(k){if(data.links&&typeof data.links[k]==="string")links[k]=data.links[k]});
  data={web:data.web||"",cards:data.cards,links:links};
  var draft=copy(data),editKind="personal",shareKind="personal",linkSel="",tipOn=false;
  var $=function(id){return document.getElementById(id)};

  function url(w){return /^https?:/i.test(w)?w:"https://"+w}
  function esc(v){return String(v||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
  function vcard(c,web){
    var parts=c.name.trim().split(/\s+/),last=parts.length>1?parts.pop():"",first=parts.join(" ");
    var L=["BEGIN:VCARD","VERSION:3.0","N:"+esc(last)+";"+esc(first)+";;;","FN:"+esc(c.name)];
    if(c.org)L.push("ORG:"+esc(c.org));
    if(c.title)L.push("TITLE:"+esc(c.title));
    if(c.tel)L.push("TEL;TYPE=CELL:"+c.tel.replace(/[^\d+]/g,""));
    if(c.email)L.push("EMAIL:"+esc(c.email));
    if(web)L.push("URL:"+url(web));
    L.push("END:VCARD");return L.join("\r\n");
  }
  function drawQR(text){
    var box=$("qr");box.style.color="#15161c";
    if(typeof qrcode!=="function"){box.textContent="QR could not load. Check your connection and reopen.";return}
    try{
      qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
      var q=qrcode(0,"M");q.addData(text,"Byte");q.make();
      var n=q.getModuleCount(),d="";
      for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+c+" "+r+"h1v1h-1z";
      box.innerHTML='<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><path fill="#15161c" d="'+d+'"/></svg>';
    }catch(e){box.textContent="That is too much text for one QR. Shorten a field."}
  }
  function select(prefix,kinds,on){kinds.forEach(function(k){$(prefix+k).setAttribute("aria-selected",String(k===on))})}
  // Accepts a bare username, an @handle or a pasted profile link, and keeps just the username.
  function handle(v){return String(v||"").trim().replace(/[?#].*$/,"").replace(/\/+$/,"").split("/").pop().replace(/^@/,"")}
  function safeUrl(v){v=String(v||"").trim();if(!v)return "";if(!/^https?:\/\//i.test(v))v="https://"+v;try{var u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.indexOf(".")>0?u.href:""}catch(e){return ""}}
  function host(u){return new URL(u).hostname.replace(/^www\./,"")}

  // Every link that is filled in, as something a QR can hold: id, name, chip letters, address, and the text shown under the QR.
  function linkItems(){
    var L=data.links,items=[],web=safeUrl(data.web);
    if(web)items.push({id:"web",n:"Website",m:"www",url:web,show:host(web)});
    var wa=L.whatsapp.replace(/\D/g,"");
    if(wa)items.push({id:"whatsapp",n:"WhatsApp",m:"WA",url:"https://wa.me/"+wa,show:L.whatsapp});
    SOC.forEach(function(s){var h=handle(L[s.k]);if(h)items.push({id:s.k,n:s.n,m:s.m,url:s.u+encodeURIComponent(h),show:"@"+h})});
    var sp=safeUrl(L.spotify);if(sp&&/(^|\.)spotify\.com$/.test(new URL(sp).hostname))items.push({id:"spotify",n:"Spotify",m:"SP",url:sp,show:"Spotify"});
    var cu=safeUrl(L.customUrl);if(cu)items.push({id:"custom",n:L.customLabel||host(cu),m:"\u2197",url:cu,show:host(cu)});
    return items;
  }
  function drawChips(items){
    var box=$("chips");box.textContent="";
    items.forEach(function(it){
      var b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(it.id===linkSel));b.title=it.n;
      var i=document.createElement("i");i.textContent=it.m;i.setAttribute("aria-hidden","true");
      var sp=document.createElement("span");sp.textContent=it.n;b.append(i,sp);
      b.addEventListener("click",function(){linkSel=it.id;closePicker();renderShare()});
      box.append(b);
    });
  }
  function empty(msg,btn){
    $("qrbox").classList.add("empty");$("qr").hidden=true;$("empty-msg").hidden=false;$("empty-btn").hidden=false;
    $("empty-msg").textContent=msg;$("empty-btn").textContent=btn;
    $("w-name").textContent=$("w-tel").textContent=$("w-title").textContent="";$("share-help").textContent="";
  }
  function renderShare(){
    select("sk-",["personal","work","links"],shareKind);
    $("qrbox").classList.remove("empty");$("qr").hidden=false;$("empty-msg").hidden=true;$("empty-btn").hidden=true;
    var isLinks=shareKind==="links",items=isLinks?linkItems():[];
    $("sk-links").textContent="Links";
    if(isLinks){
      $("qr-title").textContent="Links";
      if(!items.length){empty("No links yet","Add your links");return}
      var it=items.filter(function(x){return x.id===linkSel})[0]||items[0];linkSel=it.id;
      drawChips(items);drawQR(it.url);
      $("sk-links").textContent=items.length>1?it.n+" \u25BE":it.n; // the button names the link it is showing
      $("qr-title").textContent=it.n;$("w-name").textContent="Opens in their browser";$("w-tel").textContent=it.show;$("w-title").textContent="";
      $("share-help").textContent="Their camera opens your "+(it.id==="web"?"website":it.n)+". Showing the QR needs no signal on your phone.";
      return;
    }
    var c=data.cards[shareKind];
    $("qr-title").textContent=LABEL[shareKind];
    if(!c.name){empty("No "+shareKind+" card yet","Add "+shareKind+" card");return}
    drawQR(vcard(c,data.web));
    $("w-name").textContent=c.name;$("w-tel").textContent=c.tel||c.email;$("w-title").textContent=[c.title,c.org].filter(Boolean).join(" · ");
    $("share-help").textContent="Works with no signal. Their camera offers to add you as a contact.";
  }
  function loadForm(){
    var onLinks=editKind==="links";
    select("ek-",["personal","work","links"],editKind);
    $("card-form").hidden=onLinks;$("link-form").hidden=!onLinks;
    $("edit-eyebrow").textContent=onLinks?"Add your links":"Create your card";
    if(!onLinks)F.forEach(function(k){$("f-"+k).value=draft.cards[editKind][k]||""});
    $("f-web").value=draft.web||"";
    LK.forEach(function(k){$("l-"+k).value=draft.links[k]||""});
    $("edit-note").textContent=onLinks?"Each link gets its own QR on the Share tab. Usernames only, except Spotify and your own link, which take a pasted link."
      :isNew?"Add your details once, then show your QR. No sign-up; everything stays in this browser.":"No sign-up. Everything stays in this browser.";
  }
  function show(view){
    ["edit","share"].forEach(function(v){$("view-"+v).hidden=v!==view;$("tab-"+v).setAttribute("aria-selected",String(v===view))});
  }
  // After a save the logo gives way to the thank-you nudge for five seconds, then comes back.
  // Shown after a save and after a change of theme; "lead" is the bold word it opens with.
  function showTip(lead){
    if(tipOn)return;
    var t=$("tip");tipOn=true;$("tip-lead").textContent=lead;$("logo").hidden=$("theme-btn").hidden=true;t.classList.remove("out");t.hidden=false;
    setTimeout(function(){t.classList.add("out");setTimeout(function(){t.hidden=true;$("logo").hidden=$("theme-btn").hidden=false;tipOn=false},300)},5000);
  }

  // Themes: the colours live in the stylesheet under [data-theme]; this only records the choice. g and a paint the swatch.
  var TKEY="cardshare-theme",THEMES=[{id:"midnight",n:"Midnight",g:"#1b1d25",a:"#7461f2"},{id:"daylight",n:"Daylight",g:"#f4f3f8",a:"#6654e8"},
    {id:"ocean",n:"Ocean",g:"#0f1c22",a:"#2fb3c6"},{id:"ember",n:"Ember",g:"#211815",a:"#f0764a"}];
  var theme="midnight";
  try{var st=localStorage.getItem(TKEY);if(THEMES.some(function(x){return x.id===st}))theme=st}catch(e){}
  function applyTheme(){
    var th=THEMES.filter(function(x){return x.id===theme})[0];
    document.documentElement.setAttribute("data-theme",theme);
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",th.g);
    var box=$("theme-chips");box.textContent="";
    THEMES.forEach(function(x){
      var b=document.createElement("button");b.type="button";b.className="chip swatch";b.setAttribute("role","radio");b.setAttribute("aria-checked",String(x.id===theme));
      var i=document.createElement("i");i.style.background="linear-gradient(135deg,"+x.g+" 50%,"+x.a+" 50%)";i.setAttribute("aria-hidden","true");
      var sp=document.createElement("span");sp.textContent=x.n;b.append(i,sp);
      b.addEventListener("click",function(){
        var d=$("themes");if(d.close)d.close();else d.removeAttribute("open");
        if(x.id===theme)return;
        theme=x.id;try{localStorage.setItem(TKEY,theme)}catch(e){}
        applyTheme();scrollTo(0,0);showTip("New look.");
      });
      box.append(b);
    });
  }
  applyTheme();
  $("theme-btn").addEventListener("click",function(){var d=$("themes");if(d.showModal)d.showModal();else d.setAttribute("open","")});
  $("themes").addEventListener("click",function(e){if(e.target===$("themes")){var d=$("themes");if(d.close)d.close();else d.removeAttribute("open")}});
  function openLinks(focus){editKind="links";loadForm();show("edit");if(focus)$(focus).focus()}
  function openPicker(){var d=$("picker");if(d.showModal)d.showModal();else d.setAttribute("open","")}
  function closePicker(){var d=$("picker");if(d.close)d.close();else d.removeAttribute("open")}
  function cleanLinks(){
    draft.web=(draft.web||"").trim();
    LK.forEach(function(k){draft.links[k]=(draft.links[k]||"").trim()});
    SOC.forEach(function(s){draft.links[s.k]=handle(draft.links[s.k])});
  }
  function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function openEdit(kind,focus){if(kind)editKind=kind;loadForm();show("edit");$(focus||"f-name").focus()}

  document.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){show(b.dataset.view)})});
  ["personal","work"].forEach(function(k){$("sk-"+k).addEventListener("click",function(){shareKind=k;renderShare()})});
  // The Links button shows a link's QR and pops up the choice of which one. With a single link there is nothing to choose.
  $("sk-links").addEventListener("click",function(){shareKind="links";renderShare();if(linkItems().length>1)openPicker()});
  $("picker").addEventListener("click",function(e){if(e.target===$("picker"))closePicker()});
  $("picker-edit").addEventListener("click",function(){closePicker();openLinks()});
  ["personal","work","links"].forEach(function(k){$("ek-"+k).addEventListener("click",function(){editKind=k;loadForm()})});
  F.forEach(function(k){$("f-"+k).addEventListener("input",function(){draft.cards[editKind][k]=$("f-"+k).value})});
  $("f-web").addEventListener("input",function(){draft.web=$("f-web").value});
  LK.forEach(function(k){$("l-"+k).addEventListener("input",function(){draft.links[k]=$("l-"+k).value})});
  $("card-form").addEventListener("submit",function(e){e.preventDefault()});
  $("empty-btn").addEventListener("click",function(){shareKind==="links"?openLinks("f-web"):openEdit(shareKind)});
  $("save-card").addEventListener("click",function(){
    if(editKind==="links"){saveLinks();return}
    if(!draft.cards[editKind].name.trim()){$("edit-note").textContent="Add a name to your "+editKind+" card first, or switch to the other card.";$("f-name").focus();return}
    ["personal","work"].forEach(function(kd){F.forEach(function(k){draft.cards[kd][k]=(draft.cards[kd][k]||"").trim()})});
    cleanLinks();data=copy(draft);isNew=false;shareKind=editKind;
    store();renderShare();loadForm();show("share");
    showTip("Saved.");
  });
  // Links save on their own, so they can be changed without touching a card.
  function saveLinks(){
    cleanLinks();data.web=draft.web;data.links=copy(draft.links);shareKind="links";
    store();renderShare();loadForm();show("share");
    showTip("Saved.");
  }
  // Add to home screen: Android and desktop Chrome/Edge offer a real install prompt; iPhone and iPad have no
  // prompt, so the button shows the Share-menu steps instead. Hidden once opened from the home screen.
  var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var deferred=null;
  if(!standalone&&ios)$("install").hidden=false;
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(!standalone)$("install").hidden=false});
  addEventListener("appinstalled",function(){deferred=null;$("install").hidden=true;$("install-help").hidden=true});
  $("install").addEventListener("click",function(){
    if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null});return}
    var h=$("install-help");
    h.innerHTML=ios?"Tap <b>Share</b> in the browser bar, then <b>Add to Home Screen</b>.":"Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.";
    h.hidden=!h.hidden;$("install").setAttribute("aria-expanded",String(!h.hidden));
  });
  if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
  // First visit opens on the blank form; once cards are saved, the app always opens on the QR.
  loadForm();renderShare();show(isNew?"edit":"share");
})();
</script>

</body>
</html>
